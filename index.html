        <div style={{fontSize:9,color:'var(--muted)',lineHeight:1.6,borderTop:'1px solid var(--border)',paddingTop:8}}>
          <b>Disclaimer:</b> This document is confidential and intended solely for the use of authorized Baymont Orlando North Millenia and AD1 Global management personnel. Unauthorized distribution, reproduction, or disclosure of this information is strictly prohibited. All data contained herein is for internal operational purposes only.
          <span style={{float:'right',fontWeight:600,color:'var(--blue)'}}>Created by Franklin Alvarez · AGM</span>
        </div>
      </div>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// HOME VIEW — KPI DASHBOARD
// ══════════════════════════════════════════════════════════════════
const CAT_LABELS_ALL={linen:'Linen',guest:'Guest Supplies',cleaning:'Cleaning Supplies',frontdesk:'Front Desk',breakfast:'Breakfast'};

function HomeView({incidents,items,qty,attendants}){
  const [kpiData,setKpiData]=useState(null);
  const [reservData,setReservData]=useState(null);
  const [dragOver1,setDragOver1]=useState(false);
  const [dragOver2,setDragOver2]=useState(false);
  const [uploadMsg,setUploadMsg]=useState(null);
  const fileRef1=useRef();
  const fileRef2=useRef();

  // ── Parse sphStatistics CSV/text ──
  const parseStats=text=>{
    try{
      const lines=text.split('\n');
      const getRow=(key)=>{
        for(let i=0;i<lines.length;i++){
          if(lines[i].toLowerCase().indexOf(key.toLowerCase())!==-1){
            const nums=lines[i].match(/[\d]+\.?[\d]*/g)||[];
            return nums.map(n=>parseFloat(n));
          }
        }
        return [];
      };
      const occRow=getRow('Rooms Occupied ');
      const adrRow=getRow('ADR without Comps');
      const revRow=getRow('Total Room Revenue');
      const oooRow=getRow('OOO Rooms');
      const ooiRow=getRow('OOI Rooms');
      const occPctRow=getRow('Occ - OOO + COMPS)%');
      const guestRow=getRow('Total Number of Guest');
      const noShowRow=getRow('Total No show');
      const cancelRow=getRow('Total Reservation Cancellation');
      const revparRow=getRow('Room Revenue Per Available Room');
      const hotelRevRow=getRow('Total Hotel Revenue');
      const dateMatch=lines[0]||'';
      setKpiData({
        date:dateMatch.substring(0,40),
        occupied:occRow[0]||0,
        ooo:oooRow[0]||0,
        ooi:ooiRow[0]||0,
        occPct:occPctRow[0]||0,
        adr:adrRow[0]||0,
        roomRev:revRow[0]||0,
        hotelRev:hotelRevRow[0]||0,
        guests:guestRow[0]||0,
        noShows:noShowRow[0]||0,
        cancels:cancelRow[0]||0,
        revpar:revparRow[0]||0,
        mtdOcc:occPctRow[1]||0,
        mtdAdr:adrRow[1]||0,
        mtdRev:revRow[1]||0,
        ytdOcc:occPctRow[2]||0,
        ytdAdr:adrRow[2]||0,
        ytdRev:revRow[2]||0,
      });
      setUploadMsg({type:'success',text:'Statistics report loaded successfully.'});
      setTimeout(()=>setUploadMsg(null),3000);
    }catch(e){
      setUploadMsg({type:'error',text:'Could not parse statistics file: '+e.message});
    }
  };

  const parseReserv=text=>{
    try{
      const rows=parseCSV(text);
      const valid=rows.filter(r=>{
        const room=String(r['room_unit_number']||r['Room_Unit_Number']||'').trim();
        return room&&!isNaN(Number(room))&&ROOM_MAP[room];
      });
      const todayDate=new Date();
      const todayStr=todayDate.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      let co=0,so=0,ec=0,preArr=0;
      const roomTypeBreakdown={};
      valid.forEach(r=>{
        const rezStatus=(r['rez_status']||r['Rez_Status']||'').trim().toLowerCase();
        const depDate=(r['departure_date']||r['Departure_Date']||'').replace(/"/g,'').trim();
        const roomType=(r['room_type_code']||r['Room_Type_Code']||'').trim();
        roomTypeBreakdown[roomType]=(roomTypeBreakdown[roomType]||0)+1;
        if(rezStatus==='arrival')ec++;
        else if(rezStatus==='pre-arrival')preArr++;
        else if(rezStatus==='in house'){
          const depParsed=new Date(depDate);
          const depStr=depParsed.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
          depStr===todayStr?co++:so++;
        }
      });
      setReservData({co,so,ec,preArr,total:valid.length,roomTypeBreakdown,date:todayStr});
      setUploadMsg({type:'success',text:'✓ Reservation list loaded. '+valid.length+' reservations parsed.'});
      setTimeout(()=>setUploadMsg(null),3000);
    }catch(e){
      setUploadMsg({type:'error',text:'⚠ Could not parse reservation file: '+e.message});
    }
  };

  const handleFile=(file,type)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>type==='stats'?parseStats(e.target.result):parseReserv(e.target.result);
    reader.readAsText(file);
  };

  // Operational KPIs from app data
  const cats=Object.keys(CAT_LABELS_ALL);
  const allInvItems=cats.flatMap(c=>items[c]||[]);
  const lowStock=allInvItems.filter(i=>(qty[i.id]?.q??i.minQty)<=i.minQty*0.5).length;
  const outStock=allInvItems.filter(i=>(qty[i.id]?.q??i.minQty)===0).length;
  const openInc=incidents.filter(i=>i.status==='Open').length;
  const urgInc=incidents.filter(i=>i.status==='Open'&&i.severity==='High – Urgent').length;
  const activeAtt=attendants.filter(a=>a.status==='Active').length;

  const fmt$=n=>n?'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
  const fmtPct=n=>n?n.toFixed(1)+'%':'—';

  return(
    <div>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20,flexWrap:'wrap',gap:10}}>
        <div>
          <p style={{fontSize:18,fontWeight:700,color:'var(--blue)',letterSpacing:'-.01em'}}>Operations Dashboard</p>
          <p style={{fontSize:12,color:'var(--muted)',marginTop:2}}>{today()} · Baymont by Wyndham Orlando North Millenia</p>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {/* Upload Stats */}
          <button className="btn btn-ghost btn-sm" onClick={()=>fileRef1.current.click()} style={{gap:6}}>
            <span style={{fontSize:14}}>📊</span> Upload Statistics
          </button>
          <input ref={fileRef1} type="file" accept=".csv,.txt,.pdf" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0],'stats')}/>
          {/* Upload Reservation List */}
          <button className="btn btn-ghost btn-sm" onClick={()=>fileRef2.current.click()} style={{gap:6}}>
            <span style={{fontSize:14}}>📋</span> Upload Reservation List
          </button>
          <input ref={fileRef2} type="file" accept=".csv,.txt" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0],'reserv')}/>
        </div>
      </div>

      {uploadMsg&&<div className={`alert ${uploadMsg.type==='success'?'alert-success':'alert-warn'}`}>{uploadMsg.text}</div>}

      {/* ── SECTION 1: HOTEL PERFORMANCE (from stats) ── */}
      {kpiData?(
        <div style={{marginBottom:24}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <div style={{width:3,height:14,background:'var(--blue)',borderRadius:2}}/>
            <span style={{fontWeight:600,fontSize:13,color:'var(--text)'}}>Hotel Performance — Yesterday</span>
            <span style={{fontSize:11,color:'var(--muted)',marginLeft:4}}>{kpiData.date}</span>
          </div>

          {/* Primary KPIs */}
          <div className="stat-grid" style={{marginBottom:10}}>
            <div className="stat-card" style={{borderTop:'3px solid var(--blue)'}}>
              <div className="stat-lbl">Occupancy</div>
              <div className="stat-val" style={{color:kpiData.occPct>=85?'var(--green)':kpiData.occPct>=70?'#c07700':'var(--red)'}}>{fmtPct(kpiData.occPct)}</div>
              <div className="stat-sub">MTD {fmtPct(kpiData.mtdOcc)} · YTD {fmtPct(kpiData.ytdOcc)}</div>
            </div>
            <div className="stat-card" style={{borderTop:'3px solid var(--gold)'}}>
              <div className="stat-lbl">ADR</div>
              <div className="stat-val">{fmt$(kpiData.adr)}</div>
              <div className="stat-sub">MTD {fmt$(kpiData.mtdAdr)}</div>
            </div>
            <div className="stat-card" style={{borderTop:'3px solid var(--green)'}}>
              <div className="stat-lbl">RevPAR</div>
              <div className="stat-val">{fmt$(kpiData.revpar)}</div>
              <div className="stat-sub">Room rev / available</div>
            </div>
            <div className="stat-card" style={{borderTop:'3px solid #7b2fa0'}}>
              <div className="stat-lbl">Room Revenue</div>
              <div className="stat-val" style={{fontSize:16,paddingTop:4}}>{fmt$(kpiData.roomRev)}</div>
              <div className="stat-sub">MTD {kpiData.mtdRev?'$'+Math.round(kpiData.mtdRev).toLocaleString():'—'}</div>
            </div>
          </div>

          {/* Secondary KPIs */}
          <div className="stat-grid">
            <div className="stat-card">
              <div className="stat-lbl">Rooms Occupied</div>
              <div className="stat-val">{kpiData.occupied}</div>
              <div className="stat-sub">of 200 total</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl" style={{color:'var(--red)'}}>OOO Rooms</div>
              <div className="stat-val" style={{color:'var(--red)'}}>{kpiData.ooo}</div>
              <div className="stat-sub">Out of order</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl" style={{color:'#c07700'}}>OOI Rooms</div>
              <div className="stat-val" style={{color:'#c07700'}}>{kpiData.ooi}</div>
              <div className="stat-sub">Out of inventory</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl">Total Guests</div>
              <div className="stat-val">{kpiData.guests}</div>
              <div className="stat-sub">Adults + children</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl" style={{color:'var(--red)'}}>No-Shows</div>
              <div className="stat-val" style={{color:kpiData.noShows>3?'var(--red)':'var(--text)'}}>{kpiData.noShows}</div>
              <div className="stat-sub">Yesterday</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl" style={{color:'#c07700'}}>Cancellations</div>
              <div className="stat-val" style={{color:kpiData.cancels>20?'var(--red)':kpiData.cancels>10?'#c07700':'var(--text)'}}>{kpiData.cancels}</div>
              <div className="stat-sub">Yesterday</div>
            </div>
          </div>
        </div>
      ):(
        <div className="card" style={{marginBottom:24,border:'2px dashed var(--border)',textAlign:'center',padding:'32px 20px',cursor:'pointer'}}
          onClick={()=>fileRef1.current.click()}
          onDragOver={e=>{e.preventDefault();setDragOver1(true);}}
          onDragLeave={()=>setDragOver1(false)}
          onDrop={e=>{e.preventDefault();setDragOver1(false);handleFile(e.dataTransfer.files[0],'stats');}}
          style={{marginBottom:24,border:dragOver1?'2px dashed var(--blue)':'2px dashed var(--border)',background:dragOver1?'#eef3fc':'var(--surface)',textAlign:'center',padding:'32px 20px',cursor:'pointer',borderRadius:12}}
        >
          <div style={{fontSize:28,marginBottom:8}}>📊</div>
          <p style={{fontWeight:600,color:'var(--blue)',fontSize:13}}>Drop sphStatistics here to load hotel KPIs</p>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Occupancy · ADR · RevPAR · Revenue · No-Shows · Cancellations</p>
        </div>
      )}

      {/* ── SECTION 2: TODAY'S RESERVATION SNAPSHOT (from reserv list) ── */}
      {reservData?(
        <div style={{marginBottom:24}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <div style={{width:3,height:14,background:'var(--gold)',borderRadius:2}}/>
            <span style={{fontWeight:600,fontSize:13,color:'var(--text)'}}>Today's Reservation Snapshot</span>
            <span style={{fontSize:11,color:'var(--muted)',marginLeft:4}}>{reservData.date}</span>
          </div>
          <div className="stat-grid">
            <div className="stat-card" style={{borderTop:'3px solid var(--blue)'}}>
              <div className="stat-lbl">Check-Outs</div>
              <div className="stat-val" style={{color:'var(--blue)'}}>{reservData.co}</div>
              <div className="stat-sub">Departing today</div>
            </div>
            <div className="stat-card" style={{borderTop:'3px solid var(--green)'}}>
              <div className="stat-lbl">Stayovers</div>
              <div className="stat-val" style={{color:'var(--green)'}}>{reservData.so}</div>
              <div className="stat-sub">Continuing stay</div>
            </div>
            <div className="stat-card" style={{borderTop:'3px solid var(--gold)'}}>
              <div className="stat-lbl">Arrivals</div>
              <div className="stat-val" style={{color:'#8a6100'}}>{reservData.ec}</div>
              <div className="stat-sub">Checking in today</div>
            </div>
            <div className="stat-card">
              <div className="stat-lbl">Total Rooms</div>
              <div className="stat-val">{reservData.total}</div>
              <div className="stat-sub">In report</div>
            </div>
          </div>
          {/* Room type breakdown */}
          <div className="card-bare" style={{marginTop:10}}>
            <div className="cat-lbl">Breakdown by room type</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,padding:'10px 12px'}}>
              {Object.entries(reservData.roomTypeBreakdown).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
                <div key={type} style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',background:'var(--bg)',borderRadius:7,border:'1px solid var(--border)'}}>
                  <span style={{fontFamily:'DM Mono',fontSize:12,fontWeight:600,color:'var(--blue)'}}>{type}</span>
                  <span style={{fontSize:11,color:'var(--muted)'}}>{count} rooms</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      ):(
        <div style={{marginBottom:24,border:dragOver2?'2px dashed var(--blue)':'2px dashed var(--border)',background:dragOver2?'#eef3fc':'var(--surface)',textAlign:'center',padding:'28px 20px',cursor:'pointer',borderRadius:12,transition:'all .2s'}}
          onClick={()=>fileRef2.current.click()}
          onDragOver={e=>{e.preventDefault();setDragOver2(true);}}
          onDragLeave={()=>setDragOver2(false)}
          onDrop={e=>{e.preventDefault();setDragOver2(false);handleFile(e.dataTransfer.files[0],'reserv');}}
        >
          <div style={{fontSize:28,marginBottom:8}}>📋</div>
          <p style={{fontWeight:600,color:'var(--blue)',fontSize:13}}>Drop sphReservationList.csv here</p>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Check-Outs · Stayovers · Arrivals · Room type breakdown</p>
        </div>
      )}

      {/* ── SECTION 3: OPERATIONAL STATUS (live from app) ── */}
      <div style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
          <div style={{width:3,height:14,background:'var(--green)',borderRadius:2}}/>
          <span style={{fontWeight:600,fontSize:13,color:'var(--text)'}}>Operational Status — Live</span>
        </div>
        <div className="stat-grid">
          <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>{}}>
            <div className="stat-lbl" style={{color:outStock>0?'var(--red)':'var(--muted)'}}>Out of Stock</div>
            <div className="stat-val" style={{color:outStock>0?'var(--red)':'var(--green)'}}>{outStock}</div>
            <div className="stat-sub">{outStock>0?'Urgent reorder':'All stocked'}</div>
          </div>
          <div className="stat-card">
            <div className="stat-lbl" style={{color:lowStock>0?'#c07700':'var(--muted)'}}>Low Stock</div>
            <div className="stat-val" style={{color:lowStock>0?'#c07700':'var(--green)'}}>{lowStock}</div>
            <div className="stat-sub">Below min level</div>
          </div>
          <div className="stat-card">
            <div className="stat-lbl" style={{color:openInc>0?'#c07700':'var(--muted)'}}>Open Incidents</div>
            <div className="stat-val" style={{color:openInc>0?'#c07700':'var(--green)'}}>{openInc}</div>
            <div className="stat-sub">{urgInc>0?urgInc+' urgent':'Maintenance'}</div>
          </div>
          <div className="stat-card">
            <div className="stat-lbl">Active Attendants</div>
            <div className="stat-val">{activeAtt}</div>
            <div className="stat-sub">Room attendants</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// ROOT APP
// ══════════════════════════════════════════════════════════════════
function App(){
  const [tab,setTab]=useState('home');
  const [items,setItems,s1]=usePersist('bm5_items',DEFAULT_INV);
  const [qty,setQty,s2]=usePersist('bm5_qty',{});
  const [incidents,setIncidents,s3]=usePersist('bm5_inc',[]);
  const [tasks,setTasks,s4]=usePersist('bm5_tasks',DEFAULT_HK_TASKS);
  const [attendants,setAttendants,s5]=usePersist('bm5_att',DEFAULT_ATTENDANTS);
  const [supervisors,setSupervisors,s6]=usePersist('bm5_sup',[{id:'sv1',name:'Yovani Ayala'},{id:'sv2',name:'Midalys Castro'}]);
  const [roomData,setRoomData,s7]=usePersist('bm5_rooms',{});
  const allSynced=s1&&s2&&s3&&s4&&s5&&s6&&s7;
  const openIncs=incidents.filter(i=>i.status==='Open').length;
  const urgIncs=incidents.filter(i=>i.status==='Open'&&i.severity==='High – Urgent').length;

  if(!allSynced) return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:16,background:'var(--bg)'}}>
      <div style={{width:40,height:40,border:'3px solid var(--border)',borderTop:'3px solid var(--blue)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
      <p style={{fontSize:13,color:'var(--muted)',fontWeight:500}}>Connecting to cloud...</p>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return(
    <div>
      <nav className="nav no-print">
        <div className="nav-brand">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Baymont_Inn_%26_Suites_logo.svg/320px-Baymont_Inn_%26_Suites_logo.svg.png"
            alt="Baymont" style={{height:28,filter:'brightness(0) invert(1)',marginRight:6}}
            onError={e=>{e.target.style.display='none';}}
          />
          <div>
            <div style={{color:'#fff',fontSize:11,fontWeight:700,letterSpacing:'.05em',lineHeight:1.2}}>BAYMONT ORLANDO</div>
            <div style={{color:'var(--gold)',fontSize:9,fontWeight:600,letterSpacing:'.08em',lineHeight:1.2}}>NORTH MILLENIA</div>
          </div>
        </div>
        <div className="nav-tabs">
          <button className={`nav-tab ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}>Home</button>
          <button className={`nav-tab ${tab==='inventory'?'active':''}`} onClick={()=>setTab('inventory')}>Inventory</button>
          <button className={`nav-tab ${tab==='housekeeping'?'active':''}`} onClick={()=>setTab('housekeeping')}>Housekeeping</button>
          <button className={`nav-tab ${tab==='maintenance'?'active':''}`} onClick={()=>setTab('maintenance')}>
            Maintenance{openIncs>0&&<span style={{background:urgIncs>0?'var(--red)':'#c07700',color:'#fff',borderRadius:10,padding:'1px 5px',fontSize:10,marginLeft:3}}>{openIncs}</span>}
          </button>
          <button className={`nav-tab ${tab==='settings'?'active':''}`} onClick={()=>setTab('settings')}>Settings</button>
          <button className={`nav-tab ${tab==='report'?'active':''}`} onClick={()=>setTab('report')}>Report</button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:12}}>
          <span style={{width:7,height:7,borderRadius:'50%',background:'#4ade80',display:'inline-block',flexShrink:0}}/>
          <span style={{color:'rgba(255,255,255,.5)',fontSize:10,whiteSpace:'nowrap'}}>Cloud sync</span>
        </div>
      </nav>
      <div className="page">
        {tab==='home'&&<HomeView incidents={incidents} items={items} qty={qty} attendants={attendants}/>}
        {tab==='inventory'&&<InventoryView items={items} setItems={setItems} qty={qty} setQty={setQty}/>}
        {tab==='housekeeping'&&<HousekeepingView tasks={tasks} setTasks={setTasks} roomData={roomData} setRoomData={setRoomData} attendants={attendants} supervisors={supervisors} setSupervisors={setSupervisors}/>}
        {tab==='maintenance'&&<MaintenanceView incidents={incidents} setIncidents={setIncidents}/>}
        {tab==='settings'&&<SettingsView items={items} setItems={setItems} attendants={attendants} setAttendants={setAttendants} supervisors={supervisors} setSupervisors={setSupervisors}/>}
        {tab==='report'&&<ReportView items={items} qty={qty} incidents={incidents}/>}
      </div>
      <footer className="no-print" style={{borderTop:'1px solid var(--border)',marginTop:40,padding:'16px 20px',background:'var(--surface)'}}>
        <div style={{maxWidth:1000,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:200}}>
            <p style={{fontSize:9,color:'var(--muted)',lineHeight:1.7,textTransform:'uppercase',letterSpacing:'.04em'}}>
              <b>Disclaimer:</b> Confidential and proprietary information. This internal operational instrument is for the exclusive use of <b>Baymont Orlando North Millenia</b> and <b>AD1 Global</b> management. Unauthorized distribution is prohibited. Audit logs are intended for maintenance and inventory procurement planning.
            </p>
          </div>
          <div style={{textAlign:'right',borderLeft:'3px solid var(--gold)',paddingLeft:12}}>
            <p style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>Operational Dashboard</p>
            <p style={{fontSize:13,fontWeight:700,color:'var(--blue)',letterSpacing:'-.01em'}}>Franklin Alvarez</p>
            <p style={{fontSize:9,color:'var(--muted)'}}>Assistant General Manager</p>
          </div>
        </div>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
