<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Baymont Orlando North Millenia · Operations Hub</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root{--blue:#002D62;--gold:#C5A059;--red:#d94040;--green:#1a9e6c;--bg:#f7f6f2;--surface:#fff;--border:#e5e2d9;--text:#1a1917;--muted:#888580;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}
input,select,textarea,button{font-family:inherit;}
.nav{background:var(--blue);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:50;}
.nav-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-dot{width:7px;height:7px;background:var(--gold);border-radius:50%;}
.nav-text{color:#fff;font-size:12px;font-weight:600;letter-spacing:.05em;}
.nav-tabs{display:flex;gap:2px;flex-wrap:wrap;}
.nav-tab{background:none;border:none;color:rgba(255,255,255,.5);padding:6px 11px;font-size:11px;font-weight:500;cursor:pointer;border-radius:5px;transition:all .15s;white-space:nowrap;}
.nav-tab.active{background:rgba(255,255,255,.15);color:#fff;}
.nav-tab:hover:not(.active){color:rgba(255,255,255,.8);}
.page{max-width:1000px;margin:0 auto;padding:24px 16px;}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;}
.card+.card{margin-top:10px;}
.card-bare{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
label.lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block;}
label.lbl .req{color:var(--red);}
input[type="text"],input[type="number"],textarea,select{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;}
input[type="text"]:focus,input[type="number"]:focus,textarea:focus,select:focus{border-color:var(--blue);background:#fff;}
textarea{resize:vertical;min-height:60px;}
.fg{margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--blue);color:#fff;}.btn-primary:hover{background:#003580;}
.btn-gold{background:var(--gold);color:#fff;}.btn-gold:hover{background:#b38d46;}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{background:#148055;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);}.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger{background:none;border:1px solid #ffd0d0;color:var(--red);}.btn-danger:hover{background:#fff5f5;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-icon{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s;flex-shrink:0;}
.btn-icon:hover{border-color:var(--blue);color:var(--blue);}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-ok{background:#e6f7f1;color:var(--green);}
.badge-low{background:#fff8e6;color:#c07700;}
.badge-out{background:#fff0f0;color:var(--red);}
.badge-open{background:#fff8e6;color:#c07700;}
.badge-done{background:#e6f7f1;color:var(--green);}
.badge-crit{background:#fff0f0;color:var(--red);}
.badge-blue{background:#e8edf6;color:var(--blue);}
.badge-gray{background:#f2f0eb;color:var(--muted);}
.badge-gold{background:#fdf3e3;color:#8a6100;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px;}
.stat-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.stat-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--blue);line-height:1;}
.stat-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);}
.tbl td{padding:8px 12px;border-bottom:1px solid #f2f0eb;font-size:12px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:#fafaf8;}
.qty-ctrl{display:inline-flex;align-items:center;gap:4px;}
.qty-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text);}
.qty-btn:hover{border-color:var(--blue);color:var(--blue);}
.qty-val{font-family:'DM Mono',monospace;font-size:13px;min-width:26px;text-align:center;}
.tab-bar{display:flex;gap:2px;background:var(--border);border-radius:7px;padding:3px;margin-bottom:16px;}
.tab-pill{flex:1;text-align:center;padding:6px 6px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--muted);transition:all .15s;white-space:nowrap;}
.tab-pill.active{background:var(--surface);color:var(--blue);}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:480px;padding:22px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:700;color:var(--blue);margin-bottom:14px;}
.alert{border-radius:7px;padding:10px 14px;font-size:12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:7px;}
.alert-warn{background:#fffbee;border:1px solid #ffe58f;color:#7a5600;}
.alert-info{background:#eef3fc;border:1px solid #c3d4f7;color:var(--blue);}
.alert-success{background:#e8f7ef;border:1px solid #9fe1cb;color:#0d6b45;}
.inc-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px;margin-bottom:8px;}
.check-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f2f0eb;}
.check-row:last-child{border-bottom:none;}
.check-row input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--blue);flex-shrink:0;}
.check-label{flex:1;font-size:13px;}
.check-label.done{text-decoration:line-through;color:var(--muted);}
/* Room grid */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px;}
.room-btn{border-radius:6px;border:1px solid var(--border);padding:5px 3px;text-align:center;cursor:pointer;transition:all .12s;background:var(--bg);}
.room-btn:hover{border-color:var(--blue);transform:scale(1.03);}
.room-btn.status-SO{background:#e6f7f1;border-color:#9fe1cb;}
.room-btn.status-CO{background:#e8edf6;border-color:#b5d4f4;}
.room-btn.status-DND{background:#fff0f0;border-color:#f7c1c1;}
.room-btn.status-VD{background:#fff8e6;border-color:#fac775;}
.room-btn.status-VR{background:#f0fff4;border-color:#9fe1cb;}
.room-btn.status-VCI{background:#e6f7f1;border-color:#5dcaa5;}
.room-btn.status-LO{background:#f3e8fc;border-color:#c9a4e8;}
.room-btn.status-EC{background:#e8f4fc;border-color:#85b7eb;}
.room-btn.status-LS{background:#f5f5e6;border-color:#c8c87a;}
.room-btn.status-OOO{background:#ffeaea;border-color:#e24b4a;}
.room-btn.status-OOI{background:#fff3e0;border-color:#ef9f27;}
.room-num{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--blue);}
.room-att{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Progress bar */
.prog-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:4px;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}
/* Distribution print */
.dist-col{border:1px solid var(--border);border-radius:7px;overflow:hidden;break-inside:avoid;}
.dist-col-hdr{background:var(--blue);color:#fff;padding:5px 8px;font-size:11px;font-weight:700;text-align:center;}
.dist-col-sub{background:#f0e2c0;padding:2px 6px;font-size:9px;font-weight:700;color:var(--blue);text-align:center;border-bottom:1px solid var(--border);}
.dist-room-row{display:flex;align-items:center;gap:4px;padding:2px 6px;border-bottom:1px solid #f5f4f0;font-size:10px;}
.dist-room-row:last-child{border-bottom:none;}
.dist-num{font-family:'DM Mono',monospace;color:var(--blue);font-weight:500;min-width:30px;}
/* Productivity */
.prod-row{display:grid;grid-template-columns:180px 80px 80px 80px 1fr;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #f2f0eb;font-size:12px;}
.prod-row:last-child{border-bottom:none;}
.prod-row-hdr{background:#faf9f7;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
/* import drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;}
.drop-zone:hover,.drop-zone.active{border-color:var(--blue);background:#f0f4fb;}
@media print{
  .no-print{display:none!important;}
  .nav{display:none!important;}
  body{background:#fff;}
  .page{padding:0;max-width:100%;}
  .card{border:1px solid #ddd;box-shadow:none;}
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>

// ── CLOUD PERSIST HOOK ────────────────────────────────────────────
function usePersist(key,def){
  const [val,setVal]=useState(def);
  const [synced,setSynced]=useState(false);
  const debRef=useRef(null);

  useEffect(()=>{
    (async()=>{
      try{
        const {data,error}=await supa.from('app_state').select('data').eq('id',key).maybeSingle();
        if(!error&&data){setVal(data.data);}
        else{try{const s=localStorage.getItem(key);if(s)setVal(JSON.parse(s));}catch{}}
      }catch{try{const s=localStorage.getItem(key);if(s)setVal(JSON.parse(s));}catch{}}
      setSynced(true);
    })();
  },[key]);

  const setValSync=useCallback((updater)=>{
    setVal(prev=>{
      const next=typeof updater==='function'?updater(prev):updater;
      try{localStorage.setItem(key,JSON.stringify(next));}catch{}
      if(debRef.current)clearTimeout(debRef.current);
      debRef.current=setTimeout(async()=>{
        try{await supa.from('app_state').upsert({id:key,data:next,updated_at:new Date().toISOString()});}
        catch(e){console.warn('Supabase sync failed, saved locally',e);}
      },600);
      return next;
    });
  },[key]);

  return [val,setValSync,synced];
}

// ── CSV PARSER ────────────────────────────────────────────────────
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2)return[];
  const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());
  return lines.slice(1).map(line=>{
    const vals=line.match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=,)$|^(?=,))/g)||[];
    const row={};
    headers.forEach((h,i)=>{row[h]=(vals[i]||'').replace(/"/g,'').trim();});
    return row;
  });
}

function findCol(headers,aliases){
  return headers.find(h=>aliases.some(a=>h.includes(a)))||null;
}

function SBadge({qty,minQty}){
  if(qty===0)return <span className="badge badge-out">Out</span>;
  if(qty<=minQty*0.5)return <span className="badge badge-low">Low</span>;
  return <span className="badge badge-ok">OK</span>;
}

function ProgBar({done,total,color}){
  const pct=total>0?Math.round((done/total)*100):0;
  const c=pct===100?'var(--green)':pct>60?'var(--gold)':'var(--blue)';
  return(
    <div style={{flex:1}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--muted)',marginBottom:2}}>
        <span>{done}/{total}</span><span style={{fontWeight:700,color:c}}>{pct}%</span>
      </div>
      <div className="prog-bar"><div className="prog-fill" style={{width:pct+'%',background:c}}/></div>
    </div>
  );
}

function InventoryView({items,setItems,qty,setQty}){
  const [cat,setCat]=useState('linen');
  const [pending,setPending]=useState(null); // {id, newQ, currentQ, itemName, mode}
  const [showName,setShowName]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [editInput,setEditInput]=useState('');
  const [editMode,setEditMode]=useState('set'); // 'set' | 'add' | 'sub'
  const cats=Object.keys(CAT_LABELS);

  const getQ=id=>qty[id]?.q??((items[cat]||[]).find(x=>x.id===id)?.minQty??0);

  const openEdit=(item)=>{
    setEditingId(item.id);
    setEditInput('');
    setEditMode('set');
  };

  const applyEdit=(item)=>{
    const val=parseInt(editInput,10);
    if(isNaN(val)||val<0){setEditingId(null);return;}
    const curQ=getQ(item.id);
    let newQ=val;
    if(editMode==='add')newQ=curQ+val;
    else if(editMode==='sub')newQ=Math.max(0,curQ-val);
    setPending({id:item.id,newQ,currentQ:curQ,itemName:item.name,mode:editMode,delta:val});
    setShowName(true);
    setEditingId(null);
    setEditInput('');
  };

  const quickChange=(item,delta)=>{
    const curQ=getQ(item.id);
    const newQ=Math.max(0,curQ+delta);
    setPending({id:item.id,newQ,currentQ:curQ,itemName:item.name,mode:delta>0?'add':'sub',delta:Math.abs(delta)});
    setShowName(true);
  };

  const confirm=name=>{
    setQty(prev=>({...prev,[pending.id]:{q:pending.newQ,t:now(),by:name}}));
    setShowName(false);setPending(null);
  };

  const allItems=cats.flatMap(c=>items[c]||[]);
  const lowItems=allItems.filter(i=>{const q=qty[i.id]?.q??i.minQty;return q<=i.minQty*0.5;});
  const outItems=allItems.filter(i=>(qty[i.id]?.q??i.minQty)===0);
  const curItems=items[cat]||[];

  const modeLabel={'set':'Set to','add':'Add','sub':'Remove'};

                <div><p style={{fontSize:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em'}}>New</p><p style={{fontFamily:'DM Mono',fontSize:20,fontWeight:500,color:pending.newQ>pending.currentQ?'var(--green)':pending.newQ<pending.currentQ?'var(--red)':'var(--text)'}}>{pending.newQ}</p></div>

            <div className="fg">

    const newAssignments={...roomAssignments};
    // Sort by floor for balanced distribution
    const sorted=[...eligible].sort((a,b)=>a.num.localeCompare(b.num));
    sorted.forEach((r,i)=>{
      const att=workingActive[i%workingActive.length];
      newAssignments[r.num]=att.id;
    });
    setRoomAssignments(newAssignments);
    setShowAutoModal(false);
    const perAtt=Math.ceil(eligible.length/workingActive.length);
    setImportMsg({type:'success',text:`✓ ${eligible.length} cuartos distribuidos entre ${workingActive.length} attendants (~${perAtt} c/u).`});
    setTimeout(()=>setImportMsg(null),5000);
  };

  // ── SPH RESERVATION LIST PARSER ─────────────────────────────────
  const processCSV=text=>{
    try{
      const rows=parseCSV(text);
      if(!rows.length)throw new Error('Archivo vacío o formato no reconocido.');
      // Filter out header/junk rows
      const valid=rows.filter(r=>{
        const room=String(r['room_unit_number']||r['Room_Unit_Number']||'').trim();
        return room&&!isNaN(Number(room))&&ROOM_MAP[room];
      });
      if(!valid.length)throw new Error('No se encontraron cuartos válidos. Asegúrate de usar sphReservationList.csv');

      // Determine today's date string for departure comparison
      const todayDate=new Date();
      const todayStr=todayDate.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

      const preview=[];
      valid.forEach(row=>{
        const room=String(row['room_unit_number']||row['Room_Unit_Number']||'').trim();
        const rezStatus=(row['rez_status']||row['Rez_Status']||'').trim();
        const depDate=(row['departure_date']||row['Departure_Date']||'').replace(/"/g,'').trim();
        const roomType=(row['room_type_code']||row['Room_Type_Code']||'').trim();
        const guest=(row['guest_name']||row['Guest_Name']||'').replace(/"/g,'').trim();

        // Determine status
        let status='';
        const rezLow=rezStatus.toLowerCase();
        if(rezLow==='arrival'||rezLow==='pre-arrival'){
          status='E/C';
        } else if(rezLow==='in house'){
          // Check if departure is today
          const depParsed=new Date(depDate);
          const depStr=depParsed.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
          status=depStr===todayStr?'C/O':'S/O';
        }
        if(!status)return;
        preview.push({room,roomType,status,guest,departure:depDate,rezStatus});
      });

      if(!preview.length)throw new Error('No se pudieron determinar statuses. Verifica el archivo.');
      setImportPreview(preview);
      setImportMsg({type:'success',text:`✓ ${preview.length} cuartos listos para importar. Revisa el preview y confirma.`});
    }catch(e){
      setImportMsg({type:'error',text:'⚠ Error: '+e.message});
      setTimeout(()=>setImportMsg(null),6000);
    }
  };

  const confirmImport=()=>{
    const newStatuses={...roomStatuses};
    const newTotals={...totals};
    let co=0,so=0,ec=0;
    importPreview.forEach(r=>{
      newStatuses[r.room]=r.status;
      if(r.status==='C/O')co++;
      else if(r.status==='S/O')so++;
      else if(r.status==='E/C')ec++;
    });
    setRoomStatuses(newStatuses);
    // Auto-update totals
    setTotals(p=>({...p,co:String(co),so:String(so),arr:String(ec)}));
    setImportPreview([]);
    setImportMsg({type:'success',text:`✓ Importado: ${co} C/O · ${so} S/O · ${ec} E/C. Totales actualizados automáticamente.`});
    setTimeout(()=>setImportMsg(null),6000);
    setTab('distribution');
  };

  const handleFile=file=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>processCSV(e.target.result);
    reader.readAsText(file);
  };

  const handleDrop=e=>{
    e.preventDefault();setDragOver(false);
    const file=e.dataTransfer.files[0];
    if(file)handleFile(file);
  };

  // ── PRODUCTIVITY ───────────────────────────────────────────────
  const toggleCompleted=(attId,room)=>{
    setRoomCompleted(prev=>{
      const key=attId;
      const cur=prev[key]||[];
      const next=cur.includes(room)?cur.filter(r=>r!==room):[...cur,room];
      return {...prev,[key]:next};
    });
  };

  // Group rooms by attendant
  const byAttendant=useMemo(()=>{
    const map={};
    workingActive.forEach(a=>{map[a.id]={att:a,co:[],so:[],vd:[]};});
    REAL_ROOMS.forEach(r=>{
      const st=roomStatuses[r.num];
      const attId=roomAssignments[r.num];
      if(!attId||!map[attId])return;
      if(st==='C/O')map[attId].co.push(r.num);
      else if(st==='S/O')map[attId].so.push(r.num);
      else if(st==='V/D')map[attId].vd.push(r.num);
    });
    return map;
  },[roomStatuses,roomAssignments,activeAttendants]);

  const statCount=code=>REAL_ROOMS.filter(r=>roomStatuses[r.num]===code).length;
  const oooRooms=REAL_ROOMS.filter(r=>roomStatuses[r.num]==='OOO');
  const doneCount=tasks.filter(t=>t.done).length;
  const floorRooms=floor=>REAL_ROOMS.filter(r=>roomFloor(r.num)===floor);

  const toggleTask=id=>{setPendingTask({id});setShowNameModal(true);};
  const confirmToggle=name=>{
    setTasks(prev=>prev.map(t=>t.id===pendingTask.id?{...t,done:!t.done,doneBy:!t.done?name:null,doneAt:!t.done?now():null}:t));
    setShowNameModal(false);setPendingTask(null);
  };
  const addTask=()=>{if(!newTask.trim())return;setTasks(prev=>[...prev,{id:uid(),text:newTask.trim(),done:false}]);setNewTask('');};
  const removeTask=id=>setTasks(prev=>prev.filter(t=>t.id!==id));
  const saveEditTask=()=>{if(!editTaskId||!editTaskText.trim())return;setTasks(prev=>prev.map(t=>t.id===editTaskId?{...t,text:editTaskText.trim()}:t));setEditTaskId(null);};

  return(
    <div>
      {showNameModal&&<NameModal onConfirm={confirmToggle} onCancel={()=>{setShowNameModal(false);setPendingTask(null);}}/>}

      {/* Auto-distribute modal */}
      {showAutoModal&&(
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setShowAutoModal(false)}>
          <div className="modal">
            <div className="modal-title">⚡ Auto-Distribute Rooms</div>
            <p style={{fontSize:12,color:'var(--muted)',marginBottom:14}}>
              Rooms will be distributed evenly across <b>{workingActive.length} attendants working today</b>.
              Select which room statuses to include:
            </p>
            {[{key:'includeCO',label:'Check-Out (C/O)',count:statCount('C/O')},
              {key:'includeSO',label:'Stayover (S/O)',count:statCount('S/O')},
              {key:'includeVD',label:'Vacant Dirty (V/D)',count:statCount('V/D')}
            ].map(opt=>(
              <label key={opt.key} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--border)',cursor:'pointer',fontSize:13}}>
                <input type="checkbox" checked={autoConfig[opt.key]} onChange={e=>setAutoConfig(p=>({...p,[opt.key]:e.target.checked}))} style={{width:16,height:16,accentColor:'var(--blue)'}}/>
                <span style={{flex:1}}>{opt.label}</span>
                <span className="badge badge-blue">{opt.count} rooms</span>
              </label>
            ))}
            <p style={{fontSize:11,color:'var(--muted)',margin:'12px 0 16px'}}>
              Total eligible: <b>{
                (autoConfig.includeCO?statCount('C/O'):0)+
                (autoConfig.includeSO?statCount('S/O'):0)+
                (autoConfig.includeVD?statCount('V/D'):0)
              } rooms</b> ÷ {activeAttendants.length} attendants
            </p>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn btn-ghost" onClick={()=>setShowAutoModal(false)}>Cancel</button>
              <button className="btn btn-green" onClick={autoDistribute}>⚡ Distribute Now</button>
            </div>
          </div>
        </div>
      )}

      {/* Room detail modal */}
      {selectedRoom&&(
        <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&setSelectedRoom(null)}>
          <div className="modal">
            <div className="modal-title">Room {selectedRoom} — {ROOM_MAP[selectedRoom]?.type}</div>
            <div className="fg">
              <label className="lbl">Status</label>
              <select value={roomStatuses[selectedRoom]||''} onChange={e=>setRoomStatuses(p=>({...p,[selectedRoom]:e.target.value}))}>
                <option value="">— Unset —</option>
                {STATUS_CODES.map(c=><option key={c} value={c}>{c} — {STATUS_LABELS[c]}</option>)}
              </select>
            </div>
            <div className="fg">
              <label className="lbl">Assign to Attendant</label>
              <select value={roomAssignments[selectedRoom]||''} onChange={e=>setRoomAssignments(p=>({...p,[selectedRoom]:e.target.value}))}>
                <option value="">— Unassigned —</option>
                {activeAttendants.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
            <div className="fg">
              <label className="lbl">Notes / OOO reason</label>
              <textarea value={roomNotes[selectedRoom]||''} onChange={e=>setRoomNotes(p=>({...p,[selectedRoom]:e.target.value}))} placeholder="e.g. Leaking ceiling, A/C not working…"/>
            </div>
            {roomAssignments[selectedRoom]&&(
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,padding:'8px 0'}}>
                <input type="checkbox"
                  style={{width:16,height:16,accentColor:'var(--green)'}}
                  checked={(roomCompleted[roomAssignments[selectedRoom]]||[]).includes(selectedRoom)}
                  onChange={()=>toggleCompleted(roomAssignments[selectedRoom],selectedRoom)}
                />
                <span>Mark as Completed</span>
                {(roomCompleted[roomAssignments[selectedRoom]]||[]).includes(selectedRoom)&&
                  <span className="badge badge-ok">Done</span>}
              </label>
            )}
            <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>setSelectedRoom(null)}>Close</button>
              <button className="btn btn-primary btn-sm" onClick={()=>setSelectedRoom(null)}>Save</button>
            </div>
          </div>
        </div>
      )}

      <div className="tab-bar no-print">
        <button className={`tab-pill ${tab==='distribution'?'active':''}`} onClick={()=>setTab('distribution')}>Distribution</button>
        <button className={`tab-pill ${tab==='productivity'?'active':''}`} onClick={()=>setTab('productivity')}>Productivity</button>
        <button className={`tab-pill ${tab==='import'?'active':''}`} onClick={()=>setTab('import')}>Import PMS</button>
        <button className={`tab-pill ${tab==='checklist'?'active':''}`} onClick={()=>setTab('checklist')}>Checklist</button>
      </div>

      {/* ── DISTRIBUTION ─────────────────────────────────────── */}
      {tab==='distribution'&&(
        <div>
          {importMsg&&<div className={`alert ${importMsg.type==='success'?'alert-success':'alert-warn'}`}>{importMsg.text}</div>}
          <div className="card no-print" style={{marginBottom:12}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
              <div className="fg" style={{marginBottom:0}}>
                <label className="lbl">Supervisor</label>
                <select value={supervisor} onChange={e=>setSupervisorLocal(e.target.value)}>
                  <option value="">— Select —</option>
                  {supervisors.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                </select>
              </div>
              <div className="fg" style={{marginBottom:0}}>
                <label className="lbl">Date</label>
                <input type="text" value={distDate} onChange={e=>setDistDate(e.target.value)}/>
              </div>
              <div style={{display:'flex',alignItems:'flex-end',gap:6}}>
                <button className="btn btn-green btn-sm" style={{flex:1}} onClick={()=>setShowAutoModal(true)}>⚡ Auto-Distribute</button>
                <button className="btn btn-gold btn-sm" style={{flex:1}} onClick={()=>window.print()}>🖨 Print</button>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
              <div className="fg" style={{marginBottom:0}}><label className="lbl">Check-Outs</label><input type="number" value={totals.co} onChange={e=>setTotals(p=>({...p,co:e.target.value}))} placeholder="0"/></div>
              <div className="fg" style={{marginBottom:0}}><label className="lbl">Stayovers</label><input type="number" value={totals.so} onChange={e=>setTotals(p=>({...p,so:e.target.value}))} placeholder="0"/></div>
              <div className="fg" style={{marginBottom:0}}><label className="lbl">Arrivals</label><input type="number" value={totals.arr} onChange={e=>setTotals(p=>({...p,arr:e.target.value}))} placeholder="0"/></div>
            </div>
          </div>

          {/* Working Attendants Toggle */}
          <div className="card no-print" style={{marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <p style={{fontSize:12,fontWeight:600,color:'var(--blue)'}}>Room Attendants Working Today</p>
              <div style={{display:'flex',gap:6}}>
                <button className="btn btn-ghost btn-sm" onClick={()=>setWorkingAttendants(activeAttendants.map(a=>a.id))}>All</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>setWorkingAttendants([])}>None</button>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:6}}>
              {activeAttendants.map(a=>{
                const on=workingAttendants.includes(a.id);
                return(
                  <label key={a.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:7,border:'1px solid '+(on?'var(--blue)':'var(--border)'),background:on?'#eef3fc':'var(--bg)',cursor:'pointer',transition:'all .15s',fontSize:12,fontWeight:on?600:400,color:on?'var(--blue)':'var(--text)'}}>
                    <input type="checkbox" checked={on} onChange={()=>setWorkingAttendants(prev=>on?prev.filter(id=>id!==a.id):[...prev,a.id])} style={{accentColor:'var(--blue)',width:14,height:14}}/>
                    {a.name.split(' ').slice(0,2).join(' ')}
                  </label>
                );
              })}
            </div>
            <p style={{fontSize:10,color:'var(--muted)',marginTop:8}}>Solo los attendants seleccionados reciben cuartos al usar Auto-Distribute.</p>
          </div>

          <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:10}}>
            {STATUS_CODES.map(code=>{const c=statCount(code);return c>0?<span key={code} className="badge badge-blue">{code}: {c}</span>:null;})}
          </div>

          <div className="no-print" style={{marginBottom:12}}>
            <div style={{display:'flex',gap:4,marginBottom:8,alignItems:'center',flexWrap:'wrap'}}>
              {FLOORS.map(f=>(
                <button key={f} className={`btn btn-sm ${activeFloor===f?'btn-primary':'btn-ghost'}`} onClick={()=>setActiveFloor(f)}>Floor {f} ({floorRooms(f).length})</button>
              ))}
              <span style={{fontSize:11,color:'var(--muted)',marginLeft:6}}>Click a room to assign status, attendant & notes.</span>
            </div>
            <div className="room-grid">
              {floorRooms(activeFloor).map(r=>{
                const st=roomStatuses[r.num]||'';
                const attId=roomAssignments[r.num];
                const att=activeAttendants.find(a=>a.id===attId);
                const note=roomNotes[r.num];
                const done=(roomCompleted[attId]||[]).includes(r.num);
                return(
                  <button key={r.num} className={`room-btn ${st?'status-'+STATUS_CSS[st]:''}`}
                    onClick={()=>setSelectedRoom(r.num)}
                    title={`${r.num} (${r.type})${att?' → '+att.name:''}${note?'\n'+note:''}`}
                    style={{opacity:done?0.55:1,outline:done?'2px solid var(--green)':''}}
                  >
                    <div className="room-num">{r.num}</div>
                    <div style={{fontSize:9,color:'var(--muted)'}}>{r.type}</div>
                    {st&&<div style={{fontSize:9,fontWeight:700,color:STATUS_CLR[st]||'var(--muted)'}}>{st}</div>}
                    {att&&<div className="room-att">{att.name.split(' ')[0]}</div>}
                    {done&&<div style={{fontSize:9,color:'var(--green)',fontWeight:700}}>✓</div>}
                    {note&&!done&&<div style={{fontSize:8,color:'var(--red)'}}>⚑</div>}
                  </button>
                );
              })}
            </div>
          </div>

          {oooRooms.length>0&&(
            <div className="alert alert-warn no-print">
              ⚠ <span><b>{oooRooms.length} OOO:</b> {oooRooms.map(r=>`${r.num}${roomNotes[r.num]?' ('+roomNotes[r.num]+')':''}`).join(' · ')}</span>
            </div>
          )}

          <div className="card no-print" style={{marginBottom:14}}>
            <p style={{fontSize:12,fontWeight:600,color:'var(--blue)',marginBottom:6}}>Rooms to Strip Today</p>
            <textarea value={stripRooms} onChange={e=>setStripRooms(e.target.value)} placeholder="e.g. 101, 203, 315 — full linen strip required" style={{minHeight:44}}/>
          </div>

          {/* PRINTABLE BOARD */}
          <div style={{borderTop:'3px solid var(--blue)',paddingTop:14,marginTop:4}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:10}}>
              <div>
                <p style={{fontSize:18,fontWeight:700,color:'var(--blue)',textTransform:'uppercase'}}>Daily Room Distribution Board</p>
                <p style={{fontSize:11,color:'var(--gold)',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase'}}>Baymont by Wyndham Orlando North Millenia</p>
              </div>
              <div style={{textAlign:'right',fontSize:11}}>
                <p><b style={{color:'var(--blue)'}}>{supervisor||'_______________'}</b> <span style={{color:'var(--muted)'}}>Supervisor</span></p>
                <p style={{color:'var(--muted)',marginTop:2}}>{distDate}</p>
                <div style={{display:'flex',gap:10,marginTop:3,justifyContent:'flex-end'}}>
                  <span>C/O: <b>{totals.co||'__'}</b></span>
                  <span>S/O: <b>{totals.so||'__'}</b></span>
                  <span>Arrivals: <b>{totals.arr||'__'}</b></span>
                </div>
              </div>
            </div>

            {Object.keys(byAttendant).length>0?(
              <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.min(Object.keys(byAttendant).length,5)},1fr)`,gap:6}}>
                {Object.values(byAttendant).map(({att,co,so,vd})=>{
                  const allRooms=[...co,...so,...vd];
                  const done=(roomCompleted[att.id]||[]).filter(r=>allRooms.includes(r)).length;
                  return(
                    <div key={att.id} className="dist-col">
                      <div className="dist-col-hdr">{att.name.split(' ')[0]} {att.name.split(' ').slice(-1)[0]}</div>
                      <div style={{padding:'3px 8px',background:'#f0e2c0',fontSize:9,fontWeight:700,color:'var(--blue)',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
                        <span>Total: {allRooms.length}</span><span>Done: {done}</span>
                      </div>
                      {co.length>0&&<><div className="dist-col-sub">CHECK-OUTS ({co.length})</div>{co.map(r=><div key={r} className="dist-room-row"><span className="dist-num">{r}</span><span style={{fontSize:9,fontWeight:700,color:'var(--blue)'}}>C/O</span>{(roomCompleted[att.id]||[]).includes(r)&&<span style={{fontSize:9,color:'var(--green)',marginLeft:'auto'}}>✓</span>}</div>)}</>}
                      {so.length>0&&<><div className="dist-col-sub">STAYOVERS ({so.length})</div>{so.map(r=><div key={r} className="dist-room-row"><span className="dist-num">{r}</span><span style={{fontSize:9,fontWeight:700,color:'var(--green)'}}>S/O</span>{roomNotes[r]&&<span style={{fontSize:8,color:'var(--red)',marginLeft:2}}>⚑</span>}{(roomCompleted[att.id]||[]).includes(r)&&<span style={{fontSize:9,color:'var(--green)',marginLeft:'auto'}}>✓</span>}</div>)}</>}
                      {vd.length>0&&<><div className="dist-col-sub">VACANT DIRTY ({vd.length})</div>{vd.map(r=><div key={r} className="dist-room-row"><span className="dist-num">{r}</span><span style={{fontSize:9,fontWeight:700,color:'#c07700'}}>V/D</span></div>)}</>}
                      {Array.from({length:Math.max(0,12-allRooms.length)},(_,i)=><div key={'b'+i} className="dist-room-row" style={{opacity:.2}}><span className="dist-num">—</span></div>)}
                    </div>
                  );
                })}
              </div>
            ):(
              <div className="alert alert-info">ℹ Use <b>⚡ Auto-Distribute</b> or click rooms manually to assign attendants. The board will populate here.</div>
            )}

            {oooRooms.length>0&&(
              <div style={{marginTop:8,padding:'7px 12px',background:'#ffeaea',borderRadius:7,border:'1px solid #f7c1c1'}}>
                <p style={{fontSize:10,fontWeight:700,color:'#a00',marginBottom:3,textTransform:'uppercase',letterSpacing:'.06em'}}>OOO / Out of Order</p>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {oooRooms.map(r=><span key={r.num} style={{fontSize:10,fontFamily:'DM Mono',color:'#a00'}}>{r.num}{roomNotes[r.num]?` — ${roomNotes[r.num]}`:''}</span>)}
                </div>
              </div>
            )}
            {stripRooms&&(
              <div style={{marginTop:6,padding:'6px 12px',background:'#fff8e6',borderRadius:7,border:'1px solid #fac775'}}>
                <p style={{fontSize:10,fontWeight:700,color:'#b06000',marginBottom:2,textTransform:'uppercase',letterSpacing:'.06em'}}>Strip Rooms</p>
                <p style={{fontSize:11,color:'#7a5600'}}>{stripRooms}</p>
              </div>
            )}
            <div style={{marginTop:8,display:'flex',gap:12,flexWrap:'wrap'}}>
              {STATUS_CODES.map(code=><span key={code} style={{fontSize:9,color:'var(--muted)'}}><b>{code}</b>={STATUS_LABELS[code]}</span>)}
            </div>
          </div>
        </div>
      )}

      {/* ── PRODUCTIVITY ─────────────────────────────────────── */}
      {tab==='productivity'&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div><p className="sec-title">Shift Productivity Tracker</p><p style={{fontSize:11,color:'var(--muted)'}}>{today()} · Click ✓ on rooms in Distribution to mark done</p></div>
            <button className="btn btn-gold btn-sm no-print" onClick={()=>window.print()}>Print</button>
          </div>

          {/* Summary stats */}
          {(()=>{
            const allAssigned=Object.values(byAttendant).flatMap(({co,so,vd})=>[...co,...so,...vd]);
            const allDone=Object.entries(roomCompleted).flatMap(([attId,rooms])=>rooms.filter(r=>allAssigned.includes(r)));
            const total=allAssigned.length;
            const done=new Set(allDone).size;
            return(
              <div className="stat-grid">
                <div className="stat-card"><div className="stat-lbl">Rooms Assigned</div><div className="stat-val">{total}</div></div>
                <div className="stat-card"><div className="stat-lbl" style={{color:'var(--green)'}}>Completed</div><div className="stat-val" style={{color:'var(--green)'}}>{done}</div></div>
                <div className="stat-card"><div className="stat-lbl" style={{color:'#c07700'}}>Remaining</div><div className="stat-val" style={{color:'#c07700'}}>{total-done}</div></div>
                <div className="stat-card"><div className="stat-lbl">Overall</div><div className="stat-val" style={{color:done===total&&total>0?'var(--green)':'var(--blue)'}}>{total>0?Math.round((done/total)*100):0}%</div></div>
              </div>
            );
          })()}

          <div className="card-bare">
            <div className="prod-row prod-row-hdr">
              <span>Attendant</span><span style={{textAlign:'center'}}>Assigned</span><span style={{textAlign:'center'}}>Done</span><span style={{textAlign:'center'}}>Remaining</span><span>Progress</span>
            </div>
            {Object.values(byAttendant).map(({att,co,so,vd})=>{
              const allR=[...co,...so,...vd];
              const done=(roomCompleted[att.id]||[]).filter(r=>allR.includes(r)).length;
              const rem=allR.length-done;
              const pct=allR.length>0?Math.round((done/allR.length)*100):0;
              const barColor=pct===100?'var(--green)':pct>60?'var(--gold)':'var(--blue)';
              return(
                <div key={att.id} className="prod-row" style={{borderBottom:'1px solid #f2f0eb'}}>
                  <div>
                    <div style={{fontWeight:500,fontSize:12}}>{att.name}</div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>{co.length} C/O · {so.length} S/O{vd.length>0?` · ${vd.length} V/D`:''}</div>
                  </div>
                  <div style={{textAlign:'center',fontFamily:'DM Mono',fontSize:14,fontWeight:500}}>{allR.length}</div>
                  <div style={{textAlign:'center',fontFamily:'DM Mono',fontSize:14,fontWeight:500,color:'var(--green)'}}>{done}</div>
                  <div style={{textAlign:'center',fontFamily:'DM Mono',fontSize:14,fontWeight:500,color:rem>0?'#c07700':'var(--muted)'}}>{rem}</div>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--muted)'}}>
                      <span style={{fontWeight:700,color:barColor}}>{pct}%</span>
                    </div>
                    <div className="prog-bar"><div className="prog-fill" style={{width:pct+'%',background:barColor}}/></div>
                    {allR.length>0&&(
                      <div style={{display:'flex',flexWrap:'wrap',gap:2,marginTop:3}}>
                        {allR.map(r=>{
                          const d=(roomCompleted[att.id]||[]).includes(r);
                          return(<span key={r} style={{fontSize:9,fontFamily:'DM Mono',padding:'1px 4px',borderRadius:3,background:d?'#e6f7f1':'var(--bg)',border:'1px solid '+(d?'#9fe1cb':'var(--border)'),color:d?'var(--green)':'var(--muted)',cursor:'pointer'}} onClick={()=>toggleCompleted(att.id,r)} title={'Mark '+r+(d?' incomplete':' complete')}>{r}</span>);
                        })}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            {Object.keys(byAttendant).length===0&&(
              <div style={{padding:'20px',textAlign:'center',color:'var(--muted)',fontSize:13}}>No rooms assigned yet. Use Auto-Distribute or assign rooms manually.</div>
            )}
          </div>
        </div>
      )}

      {/* ── IMPORT PMS ───────────────────────────────────────── */}
      {tab==='import'&&(
        <div>
          <p className="sec-title">Import PMS — Reservation List (sphReservationList)</p>
          <div className="alert alert-info">
            ℹ <div>
              <b>Export the Reservation List CSV from your PMS</b> (sphReservationList). The system detecta automáticamente Arrivals, Departures y Stayovers y asigna el status correcto a cada cuarto.
              <span style={{fontSize:11,marginTop:4,display:'block',color:'var(--blue)'}}>In House + checkout hoy → C/O &nbsp;·&nbsp; In House + checkout futuro → S/O &nbsp;·&nbsp; Arrival / Pre-Arrival → E/C</span>
            </div>
          </div>
          {importMsg&&<div className={`alert ${importMsg.type==='success'?'alert-success':'alert-warn'}`}>{importMsg.text}</div>}

          <div
            className={`drop-zone ${dragOver?'active':''}`}
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={handleDrop}
            onClick={()=>fileRef.current.click()}
          >
            <div style={{fontSize:32,marginBottom:8}}>📂</div>
            <p style={{fontWeight:600,fontSize:14,color:'var(--blue)'}}>Drop sphReservationList.csv aquí</p>
            <p style={{fontSize:12,color:'var(--muted)',marginTop:3}}>o clic para buscar</p>
            <input ref={fileRef} type="file" accept=".csv,.txt" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>

          {importPreview.length>0&&(
            <div style={{marginTop:16}}>
              <p className="sec-title">Preview — {importPreview.length} cuartos detectados</p>
              <div className="card-bare" style={{maxHeight:320,overflowY:'auto'}}>
                <table className="tbl">
                  <thead><tr><th>Room</th><th>Type</th><th>Status</th><th>Guest</th><th>Departure</th></tr></thead>
                  <tbody>
                    {importPreview.map(r=>(
                      <tr key={r.room}>
                        <td style={{fontFamily:'DM Mono',fontWeight:500,color:'var(--blue)'}}>{r.room}</td>
                        <td><span className="badge badge-gray">{r.roomType}</span></td>
                        <td><span className={`badge ${r.status==='C/O'?'badge-blue':r.status==='S/O'?'badge-ok':'badge-gold'}`}>{r.status}</span></td>
                        <td style={{fontSize:11,color:'var(--muted)'}}>{r.guest}</td>
                        <td style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono'}}>{r.departure}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{display:'flex',gap:8,marginTop:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setImportPreview([])}>Cancel</button>
                <button className="btn btn-green" onClick={confirmImport}>✓ Apply to Distribution Board</button>
              </div>
            </div>
          )}

          <div style={{marginTop:20}}>
            <p className="sec-title">Columns used from sphReservationList</p>
            <div className="card-bare"><table className="tbl">
              <thead><tr><th>Column</th><th>Used for</th></tr></thead>
              <tbody>
                {[
                  ['Room_Unit_Number','Room number'],
                  ['Rez_Status','In House / Arrival / Pre-Arrival'],
                  ['Departure_Date','Detect C/O vs S/O'],
                  ['Room_Type_Code','Room type (RM1, RM3, AC1...)'],
                  ['Guest_Name','Guest name in preview'],
                  ['Adult_Child','Occupancy info'],
                ].map(([col,use])=>(
                  <tr key={col}><td style={{fontFamily:'DM Mono',fontSize:11,color:'var(--blue)'}}>{col}</td><td style={{color:'var(--muted)',fontSize:12}}>{use}</td></tr>
                ))}
              </tbody>
            </table></div>
          </div>
        </div>
      )}

      {/* ── CHECKLIST ────────────────────────────────────────── */}
      {tab==='checklist'&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div><p className="sec-title">Houseman Daily Checklist</p><p style={{fontSize:11,color:'var(--muted)'}}>{today()}</p></div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-ghost btn-sm no-print" onClick={()=>{if(window.confirm('Reset all tasks?'))setTasks(prev=>prev.map(t=>({...t,done:false,doneBy:null,doneAt:null})));}}>Reset Day</button>
              <button className="btn btn-gold btn-sm no-print" onClick={()=>window.print()}>Print</button>
            </div>
          </div>
          <div className="stat-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:14}}>
            <div className="stat-card"><div className="stat-lbl" style={{color:'var(--green)'}}>Done</div><div className="stat-val" style={{color:'var(--green)'}}>{doneCount}</div></div>
            <div className="stat-card"><div className="stat-lbl" style={{color:'#c07700'}}>Pending</div><div className="stat-val" style={{color:'#c07700'}}>{tasks.length-doneCount}</div></div>
            <div className="stat-card"><div className="stat-lbl">Total</div><div className="stat-val">{tasks.length}</div></div>
          </div>
          <div className="card">
            <div style={{display:'flex',gap:8,marginBottom:12}}>
              <input type="text" value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="Add new task…" style={{flex:1}}/>
              <button className="btn btn-primary" onClick={addTask}>Add</button>
            </div>
            {tasks.map(task=>(
              <div key={task.id} className="check-row">
                <input type="checkbox" checked={task.done} onChange={()=>toggleTask(task.id)}/>
                {editTaskId===task.id?(
                  <div style={{display:'flex',gap:6,flex:1}}>
                    <input type="text" value={editTaskText} onChange={e=>setEditTaskText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveEditTask()} style={{flex:1}}/>
                    <button className="btn btn-primary btn-sm" onClick={saveEditTask}>Save</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setEditTaskId(null)}>✕</button>
                  </div>
                ):(
                  <>
                    <span className={`check-label ${task.done?'done':''}`}>{task.text}</span>
                    {task.done&&task.doneBy&&<span style={{fontSize:10,color:'var(--green)',flexShrink:0}}>✓ {task.doneBy}</span>}
                    <button className="btn-icon no-print" onClick={()=>{setEditTaskId(task.id);setEditTaskText(task.text);}}>✎</button>
                    <button className="btn-icon no-print" onClick={()=>removeTask(task.id)} style={{color:'var(--red)'}}>✕</button>
                  </>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// MAINTENANCE VIEW
// ══════════════════════════════════════════════════════════════════
function MaintenanceView({incidents,setIncidents}){
  const [form,setForm]=useState({room:'',type:INCIDENT_TYPES[0],severity:SEVERITY[0],notes:''});
  const [filterRoom,setFilterRoom]=useState('');
  const [filterStatus,setFilterStatus]=useState('all');
  const [showName,setShowName]=useState(false);
  const [pending,setPending]=useState(null);
  const [subTab,setSubTab]=useState('log');
  const req=(type,id=null)=>{setPending({type,id});setShowName(true);};
  const confirm=name=>{
    if(pending?.type==='submit'){if(!form.room.trim()){alert('Room required.');return;}setIncidents(prev=>[{id:uid(),room:form.room.trim(),type:form.type,severity:form.severity,notes:form.notes.trim(),reportedBy:name,status:'Open',createdAt:now(),resolvedAt:null,resolvedBy:null},...prev]);setForm({room:'',type:INCIDENT_TYPES[0],severity:SEVERITY[0],notes:''});}
    else if(pending?.type==='resolve'){setIncidents(prev=>prev.map(i=>i.id===pending.id?{...i,status:'Resolved',resolvedAt:now(),resolvedBy:name}:i));}
    else if(pending?.type==='delete'){setIncidents(prev=>prev.filter(i=>i.id!==pending.id));}
    setShowName(false);setPending(null);
  };
  const filtered=useMemo(()=>incidents.filter(i=>{const rm=!filterRoom||i.room.includes(filterRoom.toUpperCase());const st=filterStatus==='all'||i.status.toLowerCase()===filterStatus;return rm&&st;}),[incidents,filterRoom,filterStatus]);
  const roomCounts=useMemo(()=>{const c={};incidents.forEach(i=>{c[i.room]=(c[i.room]||0)+1;});return c;},[incidents]);
  const maxC=Math.max(...Object.values(roomCounts),1);
  const hColor=n=>{const r=n/maxC;return r<0.33?{bg:'#fff8e6',t:'#c07700'}:r<0.66?{bg:'#ffe4cc',t:'#b85000'}:{bg:'#fff0f0',t:'var(--red)'};};
  const openC=incidents.filter(i=>i.status==='Open').length;
  const urgC=incidents.filter(i=>i.severity==='High – Urgent'&&i.status==='Open').length;
  return(
    <div>
      {showName&&<NameModal onConfirm={confirm} onCancel={()=>{setShowName(false);setPending(null);}}/>}
      <div className="stat-grid">
        <div className="stat-card"><div className="stat-lbl" style={{color:'#c07700'}}>Open</div><div className="stat-val" style={{color:'#c07700'}}>{openC}</div></div>
        <div className="stat-card"><div className="stat-lbl" style={{color:'var(--red)'}}>Urgent</div><div className="stat-val" style={{color:'var(--red)'}}>{urgC}</div></div>
        <div className="stat-card"><div className="stat-lbl" style={{color:'var(--green)'}}>Resolved</div><div className="stat-val" style={{color:'var(--green)'}}>{incidents.filter(i=>i.status==='Resolved').length}</div></div>
        <div className="stat-card"><div className="stat-lbl">Rooms w/ History</div><div className="stat-val">{Object.keys(roomCounts).length}</div></div>
      </div>
      {urgC>0&&<div className="alert alert-warn">⚠ <b>{urgC} urgent incident{urgC>1?'s':''}</b> need attention.</div>}
      <p className="sec-title">Log New Incident</p>
      <div className="card" style={{marginBottom:18}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="fg"><label className="lbl">Room <span className="req">*</span></label>
            <select value={form.room} onChange={e=>setForm(p=>({...p,room:e.target.value}))}>
              <option value="">— Select Room —</option>
              {REAL_ROOMS.map(r=><option key={r.num} value={r.num}>{r.num} ({r.type})</option>)}
            </select>
          </div>
          <div className="fg"><label className="lbl">Type</label><select value={form.type} onChange={e=>setForm(p=>({...p,type:e.target.value}))}>{INCIDENT_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
          <div className="fg"><label className="lbl">Severity</label><select value={form.severity} onChange={e=>setForm(p=>({...p,severity:e.target.value}))}>{SEVERITY.map(s=><option key={s}>{s}</option>)}</select></div>
          <div className="fg" style={{gridColumn:'1/-1'}}><label className="lbl">Notes</label><textarea value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} placeholder="Describe the issue…"/></div>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:4}}><button className="btn btn-primary" onClick={()=>req('submit')}>Log Incident →</button></div>
      </div>
      <div className="tab-bar no-print">
        <button className={`tab-pill ${subTab==='log'?'active':''}`} onClick={()=>setSubTab('log')}>Incident Log</button>
        <button className={`tab-pill ${subTab==='heat'?'active':''}`} onClick={()=>setSubTab('heat')}>Room Heat Map</button>
      </div>
      {subTab==='log'&&(<>
        <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
          <input type="text" style={{maxWidth:140}} value={filterRoom} onChange={e=>setFilterRoom(e.target.value)} placeholder="Filter room…"/>
          <select style={{maxWidth:140}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}><option value="all">All</option><option value="open">Open</option><option value="resolved">Resolved</option></select>
        </div>
        {filtered.length===0?<div className="alert alert-info">ℹ No incidents match filter.</div>:filtered.map(inc=>(
          <div key={inc.id} className="inc-card">
            <div style={{display:'flex',justifyContent:'space-between',gap:10}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                  <span style={{fontFamily:'DM Mono',fontSize:15,fontWeight:500,color:'var(--blue)'}}>Room {inc.room}</span>
                  <span className="badge badge-gray">{ROOM_MAP[inc.room]?.type||'—'}</span>
                  <span className={`badge ${inc.status==='Open'?'badge-open':'badge-done'}`}>{inc.status}</span>
                  <span className={`badge ${inc.severity==='High – Urgent'?'badge-crit':inc.severity==='Medium'?'badge-low':'badge-ok'}`}>{inc.severity}</span>
                  <span className="badge badge-blue">{inc.type}</span>
                </div>
                <p style={{fontSize:10,color:'var(--muted)',marginTop:2}}>By {inc.reportedBy} · {inc.createdAt}</p>
                {inc.notes&&<p style={{fontSize:12,marginTop:5}}>{inc.notes}</p>}
                {inc.status==='Resolved'&&<p style={{fontSize:10,color:'var(--green)',marginTop:3}}>✓ {inc.resolvedBy} · {inc.resolvedAt}</p>}
              </div>
              <div style={{display:'flex',gap:4,flexShrink:0}}>
                {inc.status==='Open'&&<button className="btn btn-ghost btn-sm" onClick={()=>req('resolve',inc.id)}>Resolve</button>}
                <button className="btn btn-danger btn-sm" onClick={()=>req('delete',inc.id)}>✕</button>
              </div>
            </div>
          </div>
        ))}
      </>)}
      {subTab==='heat'&&(Object.keys(roomCounts).length===0?<div className="alert alert-info">ℹ No incidents yet.</div>:(<>
        <div className="card" style={{marginBottom:12}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(58px,1fr))',gap:5}}>
            {Object.entries(roomCounts).sort((a,b)=>b[1]-a[1]).map(([room,count])=>{const c=hColor(count);return(<div key={room} style={{borderRadius:7,padding:'7px 4px',textAlign:'center',cursor:'pointer',background:c.bg}} onClick={()=>{setFilterRoom(room);setSubTab('log');}}>
              <div style={{fontFamily:'DM Mono',fontSize:12,fontWeight:500,color:c.t}}>{room}</div>
              <div style={{fontSize:9,color:c.t,marginTop:1}}>{count} inc.</div>
            </div>);})}
          </div>
        </div>
        <p className="sec-title">Top Rooms</p>
        <div className="card-bare"><table className="tbl">
          <thead><tr><th>Room</th><th>Type</th><th>Total</th><th>Open</th><th>Top Issue</th></tr></thead>
          <tbody>{Object.entries(roomCounts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([room,total])=>{
            const ri=incidents.filter(i=>i.room===room);const on=ri.filter(i=>i.status==='Open').length;const tc={};ri.forEach(i=>tc[i.type]=(tc[i.type]||0)+1);const top=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
            return(<tr key={room} style={{cursor:'pointer'}} onClick={()=>{setFilterRoom(room);setSubTab('log');}}><td style={{fontFamily:'DM Mono',fontWeight:500,color:'var(--blue)'}}>{room}</td><td><span className="badge badge-gray">{ROOM_MAP[room]?.type||'—'}</span></td><td style={{fontFamily:'DM Mono'}}>{total}</td><td>{on>0?<span className="badge badge-open">{on}</span>:<span className="badge badge-done">Clear</span>}</td><td style={{fontSize:11,color:'var(--muted)'}}>{top}</td></tr>);
          })}</tbody>
        </table></div>
      </>))}
    </div>
  );
}

// SETTINGS VIEW
// ══════════════════════════════════════════════════════════════════
function SettingsView({items,setItems,attendants,setAttendants,supervisors,setSupervisors}){
  const [section,setSection]=useState('attendants');
  const [editCat,setEditCat]=useState('linen');
  const [newItem,setNewItem]=useState({name:'',unit:'units',minQty:10});
  const [editingItem,setEditingItem]=useState(null);
  const [editForm,setEditForm]=useState({});
  const [newAtt,setNewAtt]=useState({name:'',code:'',status:'Active'});
  const [editAtt,setEditAtt]=useState(null);
  const [newSup,setNewSup]=useState({name:''});
  const [editSup,setEditSup]=useState(null);
  const cats=Object.keys(CAT_LABELS);
  const addItem=()=>{if(!newItem.name.trim())return;setItems(prev=>({...prev,[editCat]:[...(prev[editCat]||[]),{id:'c_'+uid(),name:newItem.name.trim(),unit:newItem.unit||'units',minQty:Number(newItem.minQty)||10}]}));setNewItem({name:'',unit:'units',minQty:10});};
  const removeItem=(ck,id)=>{if(!window.confirm('Remove?'))return;setItems(prev=>({...prev,[ck]:(prev[ck]||[]).filter(x=>x.id!==id)}));};
  const startEdit=(ck,item)=>{setEditingItem({ck,id:item.id});setEditForm({name:item.name,unit:item.unit,minQty:item.minQty});};
  const saveEdit=()=>{setItems(prev=>({...prev,[editingItem.ck]:(prev[editingItem.ck]||[]).map(x=>x.id===editingItem.id?{...x,...editForm,minQty:Number(editForm.minQty)||x.minQty}:x)}));setEditingItem(null);};
  const addAtt=()=>{if(!newAtt.name.trim())return;setAttendants(prev=>[...prev,{id:'a_'+uid(),name:newAtt.name.trim(),code:newAtt.code.trim(),status:newAtt.status}]);setNewAtt({name:'',code:'',status:'Active'});};
  const removeAtt=id=>{if(!window.confirm('Remove?'))return;setAttendants(prev=>prev.filter(x=>x.id!==id));};
  const saveAtt=()=>{setAttendants(prev=>prev.map(x=>x.id===editAtt.id?{...editAtt}:x));setEditAtt(null);};
  const addSup=()=>{if(!newSup.name.trim())return;setSupervisors(prev=>[...prev,{id:'s_'+uid(),name:newSup.name.trim()}]);setNewSup({name:''});};
  const removeSup=id=>{if(!window.confirm('Remove?'))return;setSupervisors(prev=>prev.filter(x=>x.id!==id));};
  return(
    <div>
      <div className="tab-bar no-print" style={{maxWidth:580}}>
        <button className={`tab-pill ${section==='attendants'?'active':''}`} onClick={()=>setSection('attendants')}>Room Attendants</button>
        <button className={`tab-pill ${section==='supervisors'?'active':''}`} onClick={()=>setSection('supervisors')}>Supervisors</button>
        <button className={`tab-pill ${section==='items'?'active':''}`} onClick={()=>setSection('items')}>Inventory Items</button>
      </div>
      {section==='attendants'&&(<div>
        <p className="sec-title">Room Attendants</p>
        <div className="card" style={{marginBottom:12}}>
          <p style={{fontSize:12,fontWeight:600,color:'var(--blue)',marginBottom:8}}>Add New Attendant</p>
          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr auto',gap:10,alignItems:'flex-end'}}>
            <div className="fg" style={{marginBottom:0}}><label className="lbl">Full Name <span className="req">*</span></label><input type="text" value={newAtt.name} onChange={e=>setNewAtt(p=>({...p,name:e.target.value}))} placeholder="e.g. Maria Joseph"/></div>
            <div className="fg" style={{marginBottom:0}}><label className="lbl">Code</label><input type="text" value={newAtt.code} onChange={e=>setNewAtt(p=>({...p,code:e.target.value}))} placeholder="HSKP##"/></div>
            <div className="fg" style={{marginBottom:0}}><label className="lbl">Status</label><select value={newAtt.status} onChange={e=>setNewAtt(p=>({...p,status:e.target.value}))}><option>Active</option><option>Inactive</option></select></div>
            <button className="btn btn-primary" style={{marginBottom:1}} onClick={addAtt}>Add</button>
          </div>
        </div>
        <div className="card-bare"><table className="tbl">
          <thead><tr><th>#</th><th>Name</th><th>Code</th><th>Status</th><th style={{width:120}}>Actions</th></tr></thead>
          <tbody>{attendants.map((att,i)=>(<tr key={att.id}>
            {editAtt?.id===att.id?(<><td>{i+1}</td><td><input type="text" value={editAtt.name} onChange={e=>setEditAtt(p=>({...p,name:e.target.value}))}/></td><td><input type="text" value={editAtt.code} onChange={e=>setEditAtt(p=>({...p,code:e.target.value}))}/></td><td><select value={editAtt.status} onChange={e=>setEditAtt(p=>({...p,status:e.target.value}))}><option>Active</option><option>Inactive</option></select></td><td><div style={{display:'flex',gap:4}}><button className="btn btn-primary btn-sm" onClick={saveAtt}>Save</button><button className="btn btn-ghost btn-sm" onClick={()=>setEditAtt(null)}>✕</button></div></td></>)
            :(<><td style={{color:'var(--muted)',fontSize:11,fontFamily:'DM Mono'}}>{i+1}</td><td style={{fontWeight:500}}>{att.name}</td><td style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono'}}>{att.code}</td><td><span className={`badge ${att.status==='Active'?'badge-ok':'badge-gray'}`}>{att.status}</span></td><td><div style={{display:'flex',gap:4}}><button className="btn btn-ghost btn-sm" onClick={()=>setEditAtt({...att})}>Edit</button><button className="btn btn-danger btn-sm" onClick={()=>removeAtt(att.id)}>✕</button></div></td></>)}
          </tr>))}</tbody>
        </table></div>
      </div>)}
      {section==='supervisors'&&(<div>
        <p className="sec-title">Shift Supervisors</p>
        <div className="card" style={{marginBottom:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:10,alignItems:'flex-end'}}>
            <div className="fg" style={{marginBottom:0}}><label className="lbl">Supervisor Name <span className="req">*</span></label><input type="text" value={newSup.name} onChange={e=>setNewSup({name:e.target.value})} onKeyDown={e=>e.key==='Enter'&&addSup()} placeholder="e.g. Yovani Ayala"/></div>
            <button className="btn btn-primary" style={{marginBottom:1}} onClick={addSup}>Add</button>
          </div>
        </div>
        <div className="card-bare"><table className="tbl">
          <thead><tr><th>Name</th><th style={{width:120}}>Actions</th></tr></thead>
          <tbody>{supervisors.map(s=>(<tr key={s.id}>
            {editSup?.id===s.id?(<><td><input type="text" value={editSup.name} onChange={e=>setEditSup(p=>({...p,name:e.target.value}))}/></td><td><div style={{display:'flex',gap:4}}><button className="btn btn-primary btn-sm" onClick={()=>{setSupervisors(prev=>prev.map(x=>x.id===editSup.id?{...editSup}:x));setEditSup(null);}}>Save</button><button className="btn btn-ghost btn-sm" onClick={()=>setEditSup(null)}>✕</button></div></td></>)
            :(<><td style={{fontWeight:500}}>{s.name}</td><td><div style={{display:'flex',gap:4}}><button className="btn btn-ghost btn-sm" onClick={()=>setEditSup({...s})}>Edit</button><button className="btn btn-danger btn-sm" onClick={()=>removeSup(s.id)}>✕</button></div></td></>)}
          </tr>))}</tbody>
        </table></div>
      </div>)}
      {section==='items'&&(<div>
        <p className="sec-title">Inventory Items</p>
        <div className="tab-bar" style={{maxWidth:700,marginBottom:12}}>{cats.map(c=><button key={c} className={`tab-pill ${editCat===c?'active':''}`} onClick={()=>setEditCat(c)}>{CAT_LABELS[c]}</button>)}</div>
        <div className="card" style={{marginBottom:12}}>
          <p style={{fontSize:12,fontWeight:600,color:'var(--blue)',marginBottom:8}}>Add to {CAT_LABELS[editCat]}</p>
          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr auto',gap:10,alignItems:'flex-end'}}>
            <div className="fg" style={{marginBottom:0}}><label className="lbl">Item Name <span className="req">*</span></label><input type="text" value={newItem.name} onChange={e=>setNewItem(p=>({...p,name:e.target.value}))} placeholder="Item name"/></div>
            <div className="fg" style={{marginBottom:0}}><label className="lbl">Unit</label><input type="text" value={newItem.unit} onChange={e=>setNewItem(p=>({...p,unit:e.target.value}))}/></div>
            <div className="fg" style={{marginBottom:0}}><label className="lbl">Min Qty</label><input type="number" value={newItem.minQty} onChange={e=>setNewItem(p=>({...p,minQty:e.target.value}))} min="0"/></div>
            <button className="btn btn-primary" style={{marginBottom:1}} onClick={addItem}>Add</button>
          </div>
        </div>
        <div className="card-bare"><table className="tbl">
          <thead><tr><th>Item Name</th><th>Unit</th><th>Min Qty</th><th style={{width:120}}>Actions</th></tr></thead>
          <tbody>{(items[editCat]||[]).map(item=>(<tr key={item.id}>
            {editingItem?.id===item.id?(<><td><input type="text" value={editForm.name} onChange={e=>setEditForm(p=>({...p,name:e.target.value}))}/></td><td><input type="text" value={editForm.unit} onChange={e=>setEditForm(p=>({...p,unit:e.target.value}))}/></td><td><input type="number" value={editForm.minQty} onChange={e=>setEditForm(p=>({...p,minQty:e.target.value}))} min="0"/></td><td><div style={{display:'flex',gap:4}}><button className="btn btn-primary btn-sm" onClick={saveEdit}>Save</button><button className="btn btn-ghost btn-sm" onClick={()=>setEditingItem(null)}>✕</button></div></td></>)
            :(<><td style={{fontWeight:500}}>{item.name}</td><td style={{color:'var(--muted)',fontSize:11}}>{item.unit}</td><td style={{fontFamily:'DM Mono',fontSize:11}}>{item.minQty}</td><td><div style={{display:'flex',gap:4}}><button className="btn btn-ghost btn-sm" onClick={()=>startEdit(editCat,item)}>Edit</button><button className="btn btn-danger btn-sm" onClick={()=>removeItem(editCat,item.id)}>✕</button></div></td></>)}
          </tr>))}</tbody>
        </table></div>
      </div>)}
    </div>
  );
}

        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}><div style={{width:3,height:14,background:'var(--gold)',borderRadius:2}}></div><span style={{fontWeight:600,fontSize:13}}>II. Open Maintenance Incidents</span></div>
        {openIncs.length===0?<div className="alert alert-info">✓ No open incidents.</div>:(<div className="card-bare"><table className="tbl">

          <tbody>{openIncs.map(i=>(<tr key={i.id}><td style={{fontFamily:'DM Mono',fontWeight:500,color:'var(--blue)'}}>{i.room}</td><td><span className="badge badge-gray">{ROOM_MAP[i.room]?.type||'—'}</span></td><td>{i.type}</td><td><span className={`badge ${i.severity==='High – Urgent'?'badge-crit':i.severity==='Medium'?'badge-low':'badge-ok'}`}>{i.severity}</span></td><td style={{fontSize:11}}>{i.reportedBy}</td><td style={{fontSize:10,color:'var(--muted)'}}>{i.createdAt}</td></tr>))}</tbody>
        </table></div>)}

        <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--muted)',marginBottom:6}}>
          <span>Baymont by Wyndham Orlando North Millenia · AD1 Global · Confidential Internal Document</span>
          <span style={{fontFamily:'DM Mono'}}>{today()}</span>
