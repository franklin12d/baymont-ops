*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font:400 15px/1.45 "Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;

.top .title{flex:1;min-width:0}
.top h1{margin:0;font:700 19px/1.1 "Rubik",sans-serif}
.top h1 span{display:block;font:400 22px/1 "Patrick Hand","Comic Sans MS",cursive;letter-spacing:3px;opacity:.9;margin-top:2px}
.search{width:86px;padding:8px 10px;border:0;border-radius:10px;background:#fff;color:#1B2F55;font-weight:600}
.search::placeholder{color:#7A869E}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 11px;min-height:38px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;min-height:38px;font-weight:600;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.compass{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%}

.zoom button{width:44px;height:44px;border:0;background:transparent;font:500 24px/1 "Rubik",sans-serif;color:var(--ink);cursor:pointer;padding:0}
.zoom button+button{border-top:1px solid var(--line)}
.cmenu{position:fixed;z-index:25;min-width:220px;max-width:280px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:6px;display:flex;flex-direction:column}

function newOrderAt(c){
  const t=c.t;if(!t||readOnly)return;let d=null;

    if(t.kind==='room'){const right=t.front.clone().negate().cross(UP),rel=new V(l.x-t.c.x,0,l.z-t.c.z);
      const u=(rel.dot(right)/Math.max(.5,t.sAl/2-.4)+1)/2,v=(1-rel.dot(t.front)/Math.max(.5,t.sAc/2-.4))/2;
      d={u:Math.min(.97,Math.max(.03,u)),v:Math.min(.97,Math.max(.03,v))};}
    else{if(t.parent===floorG[1])l.y-=floorG[1].position.y;d={x:l.x,y:l.y,z:l.z};}}

}

  const list=targets.filter(t=>shown(t.mesh)).map(t=>({t,d:worldOf(t).distanceTo(nearAt)})).filter(o=>o.d<=25).sort((a,b)=>a.d-b.d).slice(0,14);
  let h=head('Qué hay cerca','A 25 m del punto que marcaste',false,'area');
  h+=list.length?'<div class="tlist">'+list.map(({t,d})=>{const n=openOf(t.key).length;
    return'<button class="trow" data-act="goto" data-key="'+esc(t.key)+'"><i class="dot" style="margin-top:4px;background:var('+(STATES[t.state].v||t.baseVar)+')"></i><span class="tr-main"><b>'+esc(nameOf(t))+'</b><span>'+
      esc(n?(n===1?'1 orden abierta':n+' órdenes abiertas'):'Sin órdenes abiertas')+'</span></span><span class="tr-side"><span class="ndist" data-raw>'+esc(distTxt(d))+'</span></span></button>';}).join('')+'</div>'
    :'<p class="hint">No hay habitaciones ni áreas cerca de ese punto.</p>';
  sheet.innerHTML=h;
}

/* ===== Measure ===== */
let measure=null;
const mLineMat=new THREE.LineBasicMaterial({color:0xffffff,depthTest:false,transparent:true});
function startMeasure(p){endMeasure();measure={a:localOf(p),b:null,line:null,dots:[]};measure.dots.push(mDot(measure.a));
  $('#measure').hidden=false;$('#mText').textContent=L('Toca otro punto para medir');requestRender();}
function mDot(l){const m=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false}));m.position.set(l.x,.4,l.z);m.renderOrder=12;site.add(m);return m;}
function measureTo(x,y){
  const k=pickAt(x,y);if(!k)return;const b=localOf(k.p);
  if(measure.line){site.remove(measure.line);measure.line.geometry.dispose();}
  if(measure.dots[1]){site.remove(measure.dots[1]);measure.dots[1].geometry.dispose();measure.dots.pop();}
  measure.b=b;measure.dots.push(mDot(b));
  const g=new THREE.BufferGeometry().setFromPoints([new V(measure.a.x,.4,measure.a.z),new V(b.x,.4,b.z)]);
  measure.line=new THREE.Line(g,mLineMat);measure.line.renderOrder=11;site.add(measure.line);
  const m=distXZ(measure.a,b);$('#mText').textContent=L('Distancia')+': '+distTxt(m);requestRender();
}
function endMeasure(){if(!measure)return;measure.dots.forEach(d=>{site.remove(d);d.geometry.dispose();d.material.dispose();});
  if(measure.line){site.remove(measure.line);measure.line.geometry.dispose();}measure=null;$('#measure').hidden=true;requestRender();}
$('#mClose').addEventListener('click',endMeasure);

/* ===== My markers (saved on this device) ===== */
const MKEY='fs.map.marks.'+HOTEL;let marks=[],markPins=[];
try{const v=JSON.parse(localStorage.getItem(MKEY)||'[]');if(Array.isArray(v))marks=v.filter(m=>m&&isFinite(m.x)&&isFinite(m.z)).slice(0,30);}catch(e){}
function saveMarks(){try{localStorage.setItem(MKEY,JSON.stringify(marks));}catch(e){}}
function drawMarks(){markPins.forEach(p=>{site.remove(p);p.children[0].material.dispose();});markPins=[];
  marks.forEach(m=>{const p=makePin(css('--low'),false);p.scale.setScalar(.95);p.position.set(m.x,m.y||0,m.z);site.add(p);markPins.push(p);});requestRender();}
function markNear(p){const l=localOf(p);let best=null,bd=3;marks.forEach(m=>{const d=distXZ(m,l);if(d<bd){bd=d;best=m;}});return best;}
function addMark(p){if(marks.length>=30){toast('Llegaste al máximo de 30 marcadores.');return;}const l=localOf(p);
  marks.push({x:+l.x.toFixed(2),y:Math.max(0,+l.y.toFixed(2)),z:+l.z.toFixed(2)});saveMarks();drawMarks();toast('Marcador agregado. Solo se ve en este equipo.');}
function delMark(m){marks=marks.filter(x=>x!==m);saveMarks();drawMarks();toast('Marcador quitado.');}
drawMarks();

/* ===== How to use the map ===== */
function openHelp(){stopEvents();view='help';renderHelp();openSheet();}
function renderHelp(){
  const row=(k,v)=>'<li><b>'+esc(k)+'</b><span>'+esc(v)+'</span></li>';
  sheet.innerHTML=head('Cómo usar el mapa','Computadora y teléfono',false,'area')+
    '<h3 class="hh">Con el ratón</h3><ul class="help">'+
    row('Arrastrar','Mover el mapa')+row('Rueda','Acercar o alejar donde está el cursor')+row('Doble clic','Acercar y centrar en ese punto')+
    row('Ctrl o ⌘ + arrastrar','Girar e inclinar la vista 3D')+row('Clic','Abrir la habitación o el área con sus órdenes')+
    row('Clic derecho','Crear orden aquí, qué hay cerca, medir, marcador')+row('+ y −','Botones para acercar y alejar')+'</ul>'+
    '<h3 class="hh">En el teléfono</h3><ul class="help">'+
    row('Un dedo','Mover el mapa')+row('Pellizcar','Acercar o alejar')+row('Dos dedos y girar','Girar la vista')+row('Dos dedos arriba o abajo','Inclinar la vista')+
    row('Doble toque','Acercar y centrar')+row('Tocar','Abrir la habitación o el área')+row('Mantener presionado','Abrir el menú de opciones')+'</ul>';
}
$('#btnHelp').addEventListener('click',()=>{hideMenu();if(view==='help'&&sheet.classList.contains('open'))closeSheet();else openHelp();});

/* ===== Tema ===== */
function applyTheme(){
  renderer.setClearColor(new THREE.Color(css('--frame')));
  M.ground.color.set(css('--ground'));M.path.color.set(css('--path'));M.park.color.set(css('--park'));M.tree.color.set(css('--tree'));M.water.color.set(css('--pool'));M.slab.color.set(css('--path'));
  edgeMat.color.set(css('--edge'));envMat.color.set(css('--edge'));railMat.color.set(css('--edge'));selMat.color.set(css('--accent'));
  buildLabels();refresh();updateDraftPin();
}
window.fsTheme=function(t){document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');applyTheme();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){var t='auto';try{t=JSON.parse(localStorage.getItem('sc.theme')||'"auto"')}catch(e){}if(t!=='light'&&t!=='dark')window.fsTheme(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');});

resize();orbit.r=fitRadius();updateCam();applyTheme();applyView();
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,sleep(2500)]):Promise.resolve()).then(()=>{buildLabels();requestRender();});
initData();
})();
</script>
