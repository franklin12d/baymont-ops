<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17211f">
<title>Vendor Command Center · Baymont Orlando North Millenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17211f;
    --ink-2:#4a5654;
    --ink-3:#8b9491;
    --paper:#faf9f7;
    --panel:#ffffff;
    --line:#e6e3dd;
    --line-2:#f0eeea;
    --accent:#2d5f5c;
    --accent-2:#e8f0ee;
    --amber:#9a6f14;
    --red:#a34428;
    --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
  }
  ::selection{background:var(--accent);color:#fff;}
  button,input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 18px;}

  /* ── Header ───────────────────────────────── */
  header{background:var(--ink);color:#f4f2ee;position:sticky;top:0;z-index:40;}
  .nav{display:flex;align-items:center;gap:2px;padding-top:9px;}
  .nav a{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:#93a5a1;text-decoration:none;padding:5px 10px;border-radius:6px;
  }
  .nav a:hover{color:#f4f2ee;background:rgba(255,255,255,.07);}
  .nav a.here{color:#f4f2ee;background:rgba(255,255,255,.11);}
  .nav .sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#93a5a1;}
  .dot{width:6px;height:6px;border-radius:50%;background:#8b9491;transition:background .2s;}
  .dot.ok{background:#6db99f;}
  .dot.busy{background:#d9ac4a;}
  .dot.err{background:#d97f66;}

  .htop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:12px 0 14px;}
  .heyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8b9c98;}
  h1{font-size:19px;margin:3px 0 0;font-weight:700;letter-spacing:-.015em;}
  .hmonth{font-family:var(--mono);font-size:11px;color:#c9c4b8;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;}

  .stats{display:flex;border-top:1px solid rgba(255,255,255,.1);}
  .stat{
    flex:1;padding:9px 4px 10px;text-align:left;border:0;background:none;color:inherit;cursor:pointer;
    border-right:1px solid rgba(255,255,255,.08);padding-left:12px;
  }
  .stat:first-child{padding-left:0;}
  .stat:last-child{border-right:none;}
  .stat .n{font-family:var(--mono);font-size:18px;font-weight:500;line-height:1;display:block;}
  .stat .l{font-size:9.5px;color:#8b9c98;letter-spacing:.07em;text-transform:uppercase;margin-top:5px;display:block;}
  .stat.on .l{color:#f4f2ee;}
  .stat.on{background:rgba(255,255,255,.07);}
  .mbar{height:2px;background:rgba(255,255,255,.12);}
  .mbar i{display:block;height:100%;background:#6db99f;width:0;transition:width .35s ease;}

  /* ── Toolbar ──────────────────────────────── */
  .toolbar{background:var(--paper);padding:14px 0 10px;border-bottom:1px solid var(--line);}
  .tline{display:flex;gap:8px;align-items:center;}
  .search{position:relative;flex:1;min-width:0;}
  .search input{
    width:100%;padding:9px 32px 9px 32px;border-radius:8px;border:1px solid var(--line);
    font-size:13.5px;background:var(--panel);color:var(--ink);
  }
  .search input::placeholder{color:var(--ink-3);}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-3);}
  .search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-3);font-size:17px;cursor:pointer;padding:2px 7px;display:none;line-height:1;}
  .search.has .clr{display:block;}
  .tbtn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:8px;
    padding:9px 13px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--accent);color:var(--accent);}

  .chips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);cursor:pointer;white-space:nowrap;
  }
  .chip .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-left:5px;}
  .chip.on{background:var(--ink);color:#f4f2ee;border-color:var(--ink);}
  .chip.on .k{color:#93a5a1;}

  /* ── Attention ────────────────────────────── */
  .attn{margin:18px 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;}
  .attn > summary{
    list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:9px;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700;
  }
  .attn > summary::-webkit-details-marker{display:none;}
  .attn > summary .ct{font-family:var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:10px;letter-spacing:0;color:var(--red);}
  .attn > summary .cv{margin-left:auto;font-size:13px;color:var(--ink-3);transition:transform .2s;}
  .attn[open] > summary .cv{transform:rotate(180deg);}
  .attn-body{padding:0 14px 12px;}
  .ai{display:flex;gap:14px;padding:9px 0;border-top:1px solid var(--line-2);font-size:12.5px;}
  .ai b{flex-shrink:0;width:170px;font-weight:700;}
  .ai span{color:var(--ink-2);}
  .ai.clear{border-top:1px solid var(--line-2);color:var(--ink-3);padding-top:11px;}

  /* ── Ledger ───────────────────────────────── */
  .cat{margin-top:22px;}
  .cat > summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
    padding:0 2px 7px;border-bottom:1px solid var(--ink);
  }
  .cat > summary::-webkit-details-marker{display:none;}
  .cat h2{font-size:11.5px;margin:0;text-transform:uppercase;letter-spacing:.09em;font-weight:700;}
  .cat .ct{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-2);padding:1px 7px;border-radius:10px;}
  .cat .prog{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);}
  .cat .cv{font-size:12px;color:var(--ink-3);transition:transform .2s;}
  .cat[open] > summary .cv{transform:rotate(180deg);}

  .row{
    display:grid;grid-template-columns:100px minmax(0,1fr) auto;align-items:center;gap:14px;
    padding:11px 10px;border-bottom:1px solid var(--line-2);background:var(--panel);cursor:pointer;
  }
  .row:hover{background:#fdfcfa;}
  .row.done .vn{color:var(--accent);}
  .row.flagged .vn::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);vertical-align:middle;margin-left:7px;}
  .row.watch .vn::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);vertical-align:middle;margin-left:7px;}

  /* pipeline track — the signature control */
  .track{display:flex;gap:3px;}
  .seg{
    width:22px;height:15px;border:1px solid var(--line);background:var(--paper);border-radius:3px;
    padding:0;cursor:pointer;position:relative;transition:background .12s,border-color .12s;
  }
  .seg:hover{border-color:var(--accent);}
  .seg span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:var(--ink-3);}
  .seg.fill{background:var(--accent);border-color:var(--accent);}
  .seg.fill span{color:#fff;}
  .seg.fill:last-child{background:var(--ink);border-color:var(--ink);}

  .vn{font-weight:700;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vm{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rcv{font-size:14px;color:#cbc7bf;line-height:1;transition:transform .2s;}
  .row.open .rcv{transform:rotate(90deg);}

  .detail{display:none;padding:12px 14px 16px;background:#fdfcfa;border-bottom:1px solid var(--line-2);}
  .row.open + .detail{display:block;}
  .detail p{margin:0 0 10px;font-size:13px;line-height:1.55;color:var(--ink-2);max-width:62ch;}
  .dtags{display:flex;gap:6px;flex-wrap:wrap;}
  .tg{font-family:var(--mono);font-size:9.5px;padding:3px 9px;border-radius:10px;letter-spacing:.02em;}
  .tg.f{background:var(--accent-2);color:var(--accent);}
  .tg.r{background:#f8e9e4;color:var(--red);}
  .tg.w{background:#f8f0dc;color:var(--amber);}
  .tg.g{background:#fff;border:1px solid var(--line);color:var(--ink-3);}
  .steps{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
  .step{
    border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;
    font-size:11.5px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .step:hover{border-color:var(--accent);}
  .step b{font-family:var(--mono);font-size:9px;opacity:.5;font-weight:400;}
  .step.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .step.on b{opacity:.7;}

  .empty{text-align:center;padding:44px 12px;color:var(--ink-3);font-size:13px;}
  .empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:14.5px;}

  /* ── Foot ─────────────────────────────────── */
  .foot{
    position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--ink);color:#f4f2ee;
    padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;
  }
  .foot .fp{font-family:var(--mono);font-size:11px;color:#9aaba7;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .foot button{
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#f4f2ee;
    border-radius:7px;padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;
  }
  .foot button:hover{background:rgba(255,255,255,.16);}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:78px;z-index:60;
    background:var(--ink);color:#f4f2ee;padding:10px 18px;border-radius:20px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:.22s;box-shadow:0 6px 24px rgba(0,0,0,.16);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--red);}

  @media (max-width:620px){
    .wrap{padding:0 14px;}
    .row{grid-template-columns:100px minmax(0,1fr) 14px;gap:10px;padding:11px 2px;}
    .ai{flex-direction:column;gap:2px;}
    .ai b{width:auto;}
    h1{font-size:17px;}
    .htop{padding:10px 0 12px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}

  @media print{
    header,.toolbar,.foot,.rcv,.track,.steps,.toast{display:none !important;}
    body{background:#fff;padding:0;font-size:11px;}
    .detail{display:block !important;background:#fff;padding:2px 0 8px;}
    .row{background:#fff;border-bottom:1px solid #ddd;grid-template-columns:1fr;padding:5px 0;}
    .cat > summary{border-bottom:1.5px solid #000;}
    .attn{break-inside:avoid;border-color:#999;}
    .detail p{margin-bottom:4px;}
  }
</style>
</head>
<body>

  <div class="wrap">

<div class="toolbar">

<div class="foot">

  <button id="printBtn">Print</button>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CLOUD — Supabase (shared with Room Tracker)
   State is stored as one row per month in public.app_state.
   ========================================================= */
const SUPA_URL = 'https://wpriwhjwkwdsoiiffcrq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indwcml3aGp3a3dkc29paWZmY3JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NzQyOTgsImV4cCI6MjA5NTI1MDI5OH0.PgKCMIODcEFBhAvuAmcxHcomzOtmva87oGJCRqNFIQA';
const H = {'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};

const now = new Date();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const STATE_ID = `vendor:${monthKey}`;

function setSync(s, label){
  const d = document.getElementById('syncDot'), t = document.getElementById('syncTxt');
  d.className = 'dot ' + s;
  t.textContent = label;
}

async function cloudLoad(){
  const r = await fetch(`${SUPA_URL}/rest/v1/app_state?id=eq.${encodeURIComponent(STATE_ID)}&select=data`, {headers:H});
  if(!r.ok) throw new Error(await r.text());
  const rows = await r.json();
  return (rows[0] && rows[0].data) || {};
}

async function cloudSave(obj){
  const r = await fetch(`${SUPA_URL}/rest/v1/app_state`, {
    method:'POST',
    headers:{...H, 'Prefer':'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify({id:STATE_ID, data:obj, updated_at:new Date().toISOString()})
  });
  if(!r.ok) throw new Error(await r.text());
}

/* realtime — pick up changes made on other devices */
let rtWs = null;
function connectRealtime(){
  try{
    const url = SUPA_URL.replace('https','wss') + '/realtime/v1/websocket?apikey=' + SUPA_KEY + '&vsn=1.0.0';
    rtWs = new WebSocket(url);
    rtWs.onopen = () => rtWs.send(JSON.stringify({topic:'realtime:public:app_state', event:'phx_join', payload:{}, ref:'1'}));
    rtWs.onmessage = (e) => {
      try{
        const m = JSON.parse(e.data);
        if(m.event==='INSERT' || m.event==='UPDATE'){
          const row = m.payload && m.payload.record;
          if(row && row.id===STATE_ID && !savePending){
            state = row.data || {};
            render();
          }
        }
      }catch(_){}
    };
    rtWs.onclose = () => setTimeout(connectRealtime, 6000);
  }catch(_){}
}

  {name:'PROFIT SWORD', cat:'tech', gl:'CORP ACCT', freq:'Monthly', notes:'Corporate revenue reporting system.'},
  {name:'QUORE LLC', cat:'tech', gl:'65572000', freq:'Monthly', notes:'Operations ticketing and maintenance platform.'},
  {name:'SABRE', cat:'tech', gl:'65170250', freq:'Monthly', notes:'Distribution and reservations system.'},
  {name:'SECURITY POR OF FLORIDA', cat:'eng', gl:'80178500', freq:'Monthly', notes:'Security services. No outstanding items.'},
  {name:'SHERWIN WILLIAMS', cat:'hk', gl:'80170100', freq:'As needed', watch:true, notes:'Paint and supplies. No recent activity.'},
  {name:'SORJEN', cat:'review', gl:'—', freq:'To confirm', flag:true, notes:'No additional data on the source sheet — confirm the service with Accounting.'},
  {name:'SOUTHEASTERN LAUNDRY', cat:'laundry', gl:'84182200', freq:'Monthly', notes:'Linens and laundry.'},
  {name:'SUMMIT', cat:'review', gl:'65541300', freq:'To confirm', flag:true, notes:'No additional data on the source sheet — confirm category and service.'},
  {name:'SYSCO FOODS', cat:'fnb', gl:'40170060', freq:'Monthly', flag:true, notes:'Submitted to AD1 in MULTIPLE parts.'},
  {name:'TA EQUIPMENT — BRITANIA POOLS', cat:'eng', gl:'80178700', freq:'Monthly', notes:'Pool equipment.'},
  {name:'TECHONE', cat:'tech', gl:'65572000', freq:'As needed', watch:true, notes:'No recent activity on record.'},
  {name:'TECO', cat:'util', gl:'82179050', freq:'Monthly', notes:'Electricity (Tampa Electric Company).'},
  {name:'TRAVEL ESCAPE (Expedia TravelAds)', cat:'ota', gl:'70177600', freq:'Monthly', notes:'Expedia TravelAds advertising.'},
  {name:'VSR NETWORK TECH', cat:'util', gl:'80170100', freq:'Monthly', notes:'Voice and telephony service.'},
  {name:'WASTE CONNECTION', cat:'eng', gl:'80178750', freq:'Monthly', notes:'Waste collection.'},
];

const STEPS = [
  {key:'received',    short:'R',  label:'Received'},
  {key:'sent',        short:'A1', label:'Sent to AD1'},
  {key:'transmitted', short:'M3', label:'Transmitted to M3'},
  {key:'closed',      short:'C',  label:'Closed'},
];

/* =========================================================
   STATE
   ========================================================= */
let state = {};
let saveTimer = null, savePending = false;

function persist(){
  savePending = true;
  setSync('busy','Saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await cloudSave(state);
      setSync('ok','Synced');
    }catch(err){
      setSync('err','Sync failed');
      toast('Could not save to cloud — retrying', true);
      setTimeout(persist, 8000);
      return;
    }finally{
      savePending = false;
    }
  }, 400);
}

let activeCat = 'all';
let activeFilter = 'all';   // all | open | flag | done
let term = '';
let openRows = new Set();
let collapsed = new Set();

const st = v => state[v.name] || {};
const isDone = v => !!st(v).closed;
const doneCount = list => list.filter(isDone).length;
const catName = id => (CATEGORIES.find(c=>c.id===id)||{name:id}).name;

function matches(v){
  if(activeCat!=='all' && v.cat!==activeCat) return false;
  if(activeFilter==='open' && isDone(v)) return false;
  if(activeFilter==='done' && !isDone(v)) return false;
  if(activeFilter==='flag' && !v.flag) return false;
  if(term){
    const hay = `${v.name} ${v.gl} ${v.notes} ${catName(v.cat)} ${v.freq}`.toLowerCase();
    if(!hay.includes(term)) return false;
  }
  return true;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =========================================================
   RENDER
   ========================================================= */
function renderStats(){
  const closed = doneCount(VENDORS);
  document.getElementById('sTotal').textContent = VENDORS.length;
  document.getElementById('sOpen').textContent  = VENDORS.length - closed;
  document.getElementById('sFlag').textContent  = VENDORS.filter(v=>v.flag && !isDone(v)).length;
  document.getElementById('sDone').textContent  = closed;
  document.getElementById('mBar').style.width = (closed/VENDORS.length*100).toFixed(1)+'%';
  document.getElementById('footTxt').textContent =
    `${closed} of ${VENDORS.length} closed · ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  document.querySelectorAll('.stat').forEach(b=>b.classList.toggle('on', b.dataset.f===activeFilter));
}

function renderAttention(){
  const pend = VENDORS.filter(v=>v.flag && !isDone(v));
  document.getElementById('attnCt').textContent = pend.length;
  const box = document.getElementById('attnList');
  if(!pend.length){
    box.innerHTML = '<div class="ai clear">All clear — no flagged vendors remain open this month.</div>';
    return;
  }
  box.innerHTML = pend.map(v=>`<div class="ai"><b>${esc(v.name)}</b><span>${esc(v.notes)}</span></div>`).join('');
}

function renderChips(){
  const row = document.getElementById('chips');
  const mk = (id,label,n,on) =>
    `<button class="chip${on?' on':''}" data-cat="${id}">${label}<span class="k">${n}</span></button>`;
  let html = mk('all','All', VENDORS.length, activeCat==='all');
  CATEGORIES.forEach(c=>{
    const n = VENDORS.filter(v=>v.cat===c.id).length;
    if(n) html += mk(c.id, c.name, n, activeCat===c.id);
  });
  row.innerHTML = html;
}

function trackHtml(v){
  const s = st(v);
  return `<div class="track">${STEPS.map((step,i)=>
    `<button class="seg${s[step.key]?' fill':''}" data-v="${esc(v.name)}" data-i="${i}" title="${step.label}"><span>${step.short}</span></button>`
  ).join('')}</div>`;
}

function rowHtml(v){
  const s = st(v);
  const open = openRows.has(v.name);
  const cls = ['row', isDone(v)?'done':'', v.flag?'flagged':(v.watch?'watch':''), open?'open':''].filter(Boolean).join(' ');
  return `
    <div class="${cls}" data-row="${esc(v.name)}">
      ${trackHtml(v)}
      <div>
        <div class="vn">${esc(v.name)}</div>
        <div class="vm">GL ${esc(v.gl)} · ${esc(v.freq)}</div>
      </div>
      <div class="rcv">›</div>
    </div>
    <div class="detail">
      <p>${esc(v.notes)}</p>
      <div class="dtags">
        <span class="tg g">GL ${esc(v.gl)}</span>
        <span class="tg f">${esc(v.freq)}</span>
        ${v.flag?'<span class="tg r">Follow-up</span>':''}
        ${v.watch?'<span class="tg w">Verify</span>':''}
      </div>
      <div class="steps">
        ${STEPS.map((step,i)=>`<button class="step${s[step.key]?' on':''}" data-v="${esc(v.name)}" data-i="${i}"><b>${i+1}</b>${step.label}</button>`).join('')}
      </div>
    </div>`;
}

function render(){
  renderStats();
  renderAttention();
  renderChips();

  const led = document.getElementById('ledger');
  let html = '', any = false;

  CATEGORIES.forEach(c=>{
    const list = VENDORS.filter(v=>v.cat===c.id && matches(v));
    if(!list.length) return;
    any = true;
    const isOpen = !collapsed.has(c.id);
    html += `
      <details class="cat" data-cat="${c.id}"${isOpen?' open':''}>
        <summary>
          <span class="cv">⌄</span>
          <h2>${c.name}</h2>
          <span class="ct">${list.length}</span>
          <span class="prog">${doneCount(list)}/${list.length} closed</span>
        </summary>
        ${list.map(rowHtml).join('')}
      </details>`;
  });

  led.innerHTML = html;
  document.getElementById('empty').style.display = any ? 'none' : 'block';
}

/* =========================================================
   INTERACTION
   ========================================================= */
function setStep(name, idx){
  const v = VENDORS.find(x=>x.name===name);
  if(!v) return;
  const s = state[name] || (state[name] = {});
  const wasOn = !!s[STEPS[idx].key];
  // Cascade: checking step N completes 1..N; unchecking it clears N..4
  STEPS.forEach((step,i)=>{
    if(wasOn){ if(i>=idx) s[step.key] = false; }
    else     { if(i<=idx) s[step.key] = true;  }
  });
  persist();
  render();
  if(!wasOn && idx===STEPS.length-1) toast(`${name} closed`);
}

let toastTimer;
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

document.getElementById('ledger').addEventListener('click', e=>{
  const seg = e.target.closest('.seg, .step');
  if(seg){ e.stopPropagation(); setStep(seg.dataset.v, Number(seg.dataset.i)); return; }
  const row = e.target.closest('.row');
  if(row){
    const n = row.dataset.row;
    openRows.has(n) ? openRows.delete(n) : openRows.add(n);
    row.classList.toggle('open');
  }
});

document.getElementById('ledger').addEventListener('toggle', e=>{
  const d = e.target.closest('.cat');
  if(!d) return;
  d.open ? collapsed.delete(d.dataset.cat) : collapsed.add(d.dataset.cat);
}, true);

document.getElementById('chips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  activeCat = chip.dataset.cat;
  render();
});

document.querySelectorAll('.stat').forEach(b=>{
  b.addEventListener('click', ()=>{
    activeFilter = (activeFilter===b.dataset.f) ? 'all' : b.dataset.f;
    render();
  });
});

const qInput = document.getElementById('q');
qInput.addEventListener('input', e=>{
  term = e.target.value.trim().toLowerCase();
  document.getElementById('searchWrap').classList.toggle('has', !!term);
  render();
});
document.getElementById('qClear').addEventListener('click', ()=>{
  qInput.value=''; term=''; document.getElementById('searchWrap').classList.remove('has'); render(); qInput.focus();
});

document.getElementById('expandBtn').addEventListener('click', e=>{
  const anyOpen = document.querySelectorAll('.row.open').length > 0;
  openRows = new Set(anyOpen ? [] : VENDORS.filter(matches).map(v=>v.name));
  e.target.textContent = anyOpen ? 'Expand all' : 'Collapse all';
  render();
});

document.getElementById('printBtn').addEventListener('click', ()=>window.print());
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm(`Reset the ${MONTHS[now.getMonth()]} checklist for all ${VENDORS.length} vendors? This clears every mark for everyone on the team.`)){
    state = {}; persist(); render(); toast('Month reset');
  }
});

/* =========================================================
   BOOT
   ========================================================= */
(async function init(){
  document.getElementById('hMonth').textContent = `${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  setSync('busy','Connecting');
  render();
  try{
    state = await cloudLoad();
    setSync('ok','Synced');
  }catch(err){
    setSync('err','Offline');
    toast('Cloud unavailable — changes will not be saved', true);
  }
  render();
  connectRealtime();
})();
</script>
</body>
